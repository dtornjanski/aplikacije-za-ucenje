  <a class="skip-link" href="#app">Preskoči na sadržaj</a>
  <header class="site-header">
    <button class="brand" type="button" data-action="home" aria-label="Istraživači našeg svijeta – početna"><span aria-hidden="true">✨</span><strong>Istraživači našeg svijeta</strong></button>
    <span class="grade">Priroda i društvo · 2. razred</span>
  </header>
  <main id="app" tabindex="-1"></main>
  <p id="announcer" class="sr-only" aria-live="polite"></p>
  <footer>Promatraj, poveži i otkrivaj svojim tempom.</footer>
  <script>(function(root,factory){
  const api=factory();
  if(typeof module==='object'&&module.exports) module.exports=api;
  else root.WorldEngine=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  'use strict';

  const VERSION=1;
  const text=value=>String(value??'').trim().replace(/\s+/g,' ').toLocaleLowerCase('hr');
  const clone=value=>JSON.parse(JSON.stringify(value));
  const choiceTypes=new Set(['single','cause','observe']);
  const sequenceTypes=new Set(['order','timeline']);

  function makeRng(seed){
    let state=(Number(seed)>>>0)||0x6d2b79f5;
    return function(){
      state+=0x6d2b79f5;
      let value=state;
      value=Math.imul(value^(value>>>15),value|1);
      value^=value+Math.imul(value^(value>>>7),value|61);
      return ((value^(value>>>14))>>>0)/4294967296;
    };
  }

  function shuffle(values,rng=Math.random){
    const copy=values.slice();
    for(let index=copy.length-1;index>0;index--){
      const swap=Math.floor(rng()*(index+1));
      [copy[index],copy[swap]]=[copy[swap],copy[index]];
    }
    return copy;
  }

  function pairKey(pair){return `${text(pair?.[0])}\u0000${text(pair?.[1])}`;}
  function normalizedZones(zones,names){
    if(!zones||typeof zones!=='object') return null;
    const normalized={};
    for(const name of names){
      if(!Array.isArray(zones[name])) return null;
      normalized[text(name)]=zones[name].map(text).sort();
    }
    return normalized;
  }

  function complete(question,response){
    if(!question||!response||typeof response!=='object') return false;
    if(choiceTypes.has(question.type)) return Boolean(text(response.selected));
    if(question.type==='match') return Array.isArray(response.pairs)&&response.pairs.length===question.answer.length&&response.pairs.every(pair=>Array.isArray(pair)&&pair.length===2&&text(pair[0])&&text(pair[1]));
    if(question.type==='sort'){
      const names=Object.keys(question.answer);
      return names.every(name=>Array.isArray(response.zones?.[name]))&&Object.values(response.zones||{}).flat().length===Object.values(question.answer).flat().length;
    }
    if(sequenceTypes.has(question.type)) return Array.isArray(response.items)&&response.items.length===question.answer.length&&response.items.every(value=>text(value));
    return false;
  }

  function check(question,response){
    if(!complete(question,response)) return false;
    if(choiceTypes.has(question.type)) return text(response.selected)===text(question.answer);
    if(question.type==='match'){
      const expected=question.answer.map(pairKey).sort(),actual=response.pairs.map(pairKey).sort();
      return new Set(actual).size===actual.length&&JSON.stringify(actual)===JSON.stringify(expected);
    }
    if(question.type==='sort'){
      const names=Object.keys(question.answer),expected=normalizedZones(question.answer,names),actual=normalizedZones(response.zones,names);
      if(!actual) return false;
      return JSON.stringify(actual)===JSON.stringify(expected);
    }
    if(sequenceTypes.has(question.type)) return question.answer.every((value,index)=>text(value)===text(response.items[index]));
    return false;
  }

  function createSession(level,world,seed,questions){
    if(!Array.isArray(questions)||questions.length===0) throw new Error('Runda mora sadržavati zadatke.');
    return {version:VERSION,level,world,seed:Number(seed)>>>0,questions:clone(questions),index:0,phase:'answer',attempts:questions.map(()=>0),solved:questions.map(()=>false),responses:questions.map(()=>null)};
  }

  function submit(session,response){
    const index=session.index,question=session.questions[index];
    if(session.solved[index]) return 'locked';
    if(!complete(question,response)) return 'empty';
    session.attempts[index]+=1;
    session.responses[index]=clone(response);
    if(!check(question,response)){session.phase='incorrect';return 'incorrect';}
    session.solved[index]=true;session.phase='correct';return 'correct';
  }

  function advance(session){
    if(!session.solved[session.index]) return false;
    if(session.index>=session.questions.length-1){session.phase='complete';return true;}
    session.index+=1;session.phase='answer';return true;
  }

  function summarize(session){
    const solved=session.solved.filter(Boolean).length;
    let firstTry=0,retried=0;
    session.solved.forEach((done,index)=>{if(done){if(session.attempts[index]===1)firstTry+=1;else retried+=1;}});
    return {solved,total:session.questions.length,firstTry,retried};
  }

  function serialize(session){
    return JSON.stringify({version:VERSION,level:session.level,world:session.world,seed:session.seed,index:session.index,phase:session.phase,attempts:session.attempts,solved:session.solved,responses:session.responses});
  }

  function sameMembers(values,allowed){
    const counts=list=>list.reduce((map,value)=>map.set(text(value),(map.get(text(value))||0)+1),new Map());
    const actual=counts(values),expected=counts(allowed);
    if(actual.size!==expected.size) return false;
    for(const [value,count] of actual) if(count!==expected.get(value)) return false;
    return true;
  }

  function responseAllowed(question,response){
    if(response===null) return true;
    if(!complete(question,response)) return false;
    if(choiceTypes.has(question.type)) return question.options.some(option=>text(option)===text(response.selected));
    if(question.type==='match'){
      const left=response.pairs.map(pair=>pair[0]),right=response.pairs.map(pair=>pair[1]);
      return sameMembers(left,question.left)&&sameMembers(right,question.right);
    }
    if(question.type==='sort'){
      const keys=Object.keys(response.zones||{});
      if(keys.length!==question.zones.length||keys.some(name=>!question.zones.includes(name))) return false;
      return sameMembers(Object.values(response.zones).flat(),question.items);
    }
    if(sequenceTypes.has(question.type)) return sameMembers(response.items,question.items);
    return false;
  }

  function restore(raw,buildRound){
    try{
      const saved=typeof raw==='string'?JSON.parse(raw):raw;
      if(!saved||saved.version!==VERSION||typeof buildRound!=='function') return null;
      if(!Number.isInteger(saved.seed)||saved.seed<0||!Number.isInteger(saved.index)) return null;
      const questions=buildRound(saved.level,saved.world,saved.seed),total=questions.length;
      if(saved.index<0||saved.index>=total||!['answer','incorrect','correct','complete'].includes(saved.phase)) return null;
      if(!Array.isArray(saved.attempts)||!Array.isArray(saved.solved)||!Array.isArray(saved.responses)) return null;
      if(saved.attempts.length!==total||saved.solved.length!==total||saved.responses.length!==total) return null;
      if(saved.attempts.some(value=>!Number.isInteger(value)||value<0)||saved.solved.some(value=>typeof value!=='boolean')) return null;
      for(let index=0;index<total;index++){
        if(!responseAllowed(questions[index],saved.responses[index])) return null;
        if(index<saved.index&&(!saved.solved[index]||saved.attempts[index]<1||!check(questions[index],saved.responses[index]))) return null;
        if(index>saved.index&&(saved.solved[index]||saved.attempts[index]!==0||saved.responses[index]!==null)) return null;
      }
      const current=saved.index,response=saved.responses[current],question=questions[current];
      if(saved.phase==='answer'&&(saved.solved[current]||response!==null)) return null;
      if(saved.phase==='incorrect'&&(saved.solved[current]||saved.attempts[current]<1||!response||check(question,response))) return null;
      if(saved.phase==='correct'&&(!saved.solved[current]||saved.attempts[current]<1||!check(question,response))) return null;
      if(saved.phase==='complete'&&(current!==total-1||saved.solved.some(value=>!value)||!check(question,response))) return null;
      const session=createSession(saved.level,saved.world,saved.seed,questions);
      session.index=current;session.phase=saved.phase;session.attempts=saved.attempts.slice();session.solved=saved.solved.slice();session.responses=clone(saved.responses);
      return session;
    }catch(error){return null;}
  }

  return {VERSION,makeRng,shuffle,complete,check,createSession,submit,advance,summarize,serialize,restore};
});
</script>

      C('Zatvaramo hladnjak','Zašto vrata hladnjaka ne držimo dugo otvorena?','uređaj tada troši više energije za hlađenje',['hrana postaje glasnija','svjetlo u kuhinji nestane','vrata postaju lakša']),
      V('Svjetlosno onečišćenje','Koji primjer nepotrebno troši energiju i stvara previše svjetla?','jaka rasvjeta praznog igrališta cijelu noć',['svjetlo dok čitamo','semafor koji upravlja prometom','mala svjetiljka pri nestanku struje'])
    ],
    health:[
      S('Zdrava navika','Što pomaže zdravlju svaki dan?','kretanje i dovoljno sna',['preskakanje svih obroka','cijeli dan bez vode','stalno sjedenje bez odmora']),
      M('Navika i korist','Spoji naviku s koristi.',[['pranje ruku','uklanja nečistoću'],['spavanje','tijelo se odmara'],['kretanje','jača tijelo'],['raznolika prehrana','daje različite hranjive tvari']]),
      Z('Češće ili rjeđe','Razvrstaj izbor hrane.',{češće:['povrće','voće','voda'],rjeđe:['slatki napitak','puno slatkiša','vrlo slane grickalice']}),
      O('Pravilno perem ruke','Složi postupak.',['smoči ruke','nanesi sapun','istrljaj dlanove i među prstima','isperi vodom','obriši čistim ručnikom']),
      C('Doručak prije škole','Zašto je koristan uravnotežen doručak?','daje tijelu energiju za početak dana',['zamjenjuje sav san','uklanja potrebu za vodom','čini torbu lakšom']),
      V('Tanjur raznolike hrane','Koji obrok je najraznolikiji?','povrće, žitarice i izvor bjelančevina',['samo bomboni','samo gazirani napitak','samo jedna slana grickalica']),
      T('Nakon tjelesne aktivnosti','Poredaj brigu o sebi.',['smiri disanje','popij vodu','presvuci mokru odjeću','operi se','odmori se']),
      S('Otpad ili smeće','Što je otpad koji se može pravilno odvojiti?','čista papirnata kutija',['mješavina svega bačena na tlo','razbijeno nepoznato sredstvo','prljava tekućina u parku']),
      M('Otpad i spremnik','Spoji otpad s uobičajenom skupinom.',[['novine','papir'],['staklenka','staklo'],['kora banane','biootpad'],['plastična boca','plastika']]),
      Z('Čuvamo ili onečišćujemo','Razvrstaj postupke.',{čuvamo:['gasimo nepotrebno svjetlo','odvajamo otpad','hodamo ili vozimo bicikl kada možemo'],onečišćujemo:['bacamo otpad u prirodu','stvaramo nepotrebnu buku','ostavljamo jaka svjetla bez potrebe']}),
      C('Odmor od zaslona','Zašto radimo stanke pri uporabi digitalne tehnologije?','odmaramo oči i tijelo',['uređaj zaboravi podatke','vrijeme se zaustavi','stol postane viši']),
      V('Zvučno onečišćenje','Koji primjer pokazuje nepotrebnu jaku buku?','glasna glazba noću uz otvorene prozore',['tihi razgovor','zvono za opasnost','ptičji pjev u parku'])
    ],
    nature:[
      S('Živo ili neživo','Što je živo biće?','maslačak',['kamen','lokva','oblak']),
      M('Dio biljke i uloga','Spoji dio i ulogu.',[['korijen','upija vodu'],['stabljika','drži biljku'],['list','prima svjetlost'],['cvijet','sudjeluje u nastanku ploda']]),
      Z('Živo ili neživo','Razvrstaj primjere.',{živo:['hrast','mrav','gljiva'],neživo:['kamen','voda','zrak']}),
      O('Od sjemena do biljke','Složi promjene.',['sjeme je u vlažnoj zemlji','iz sjemena izlazi klica','razvijaju se korijen i stabljika','pojavljuju se novi listovi','nastaje nova biljka']),
      C('Biljka bez svjetla','Zašto biljka dugo bez svjetla slabi?','ne dobiva uvjet potreban za zdrav rast',['zemlja postane metal','listovi prestanu imati dijelove','posuda izgubi oblik']),
      V('Svojstvo tvari','Čaša propušta pogled na predmet iza nje. Koje svojstvo opažamo?','prozirnost',['hrapavost','miris','glasnoću']),
      T('Jednostavno istraživanje','Poredaj korake.',['postavi pitanje','predvidi što će se dogoditi','izvedi sigurno opažanje','zapiši rezultat','usporedi rezultat s predviđanjem']),
      S('Osjetilo za miris','Kojim osjetilom prepoznajemo miris?','njuhom',['sluhom','vidom','dodirom']),
      M('Životinja i kretanje','Spoji životinju i način kretanja.',[['riba','pliva'],['ptica','leti'],['zmija','gmiže'],['zec','skače']]),
      Z('Svojstvo čvrste ili tekuće tvari','Razvrstaj opažanja.',{čvrsto:['zadržava vlastiti oblik','može biti tvrdo','može biti savitljivo'],tekuće:['teče','poprima oblik posude','može se preliti']}),
      C('Predmet pluta','Što možemo zaključiti kada predmet ostane na površini vode?','u tom pokusu pluta',['sigurno je od metala','nema nikakvu masu','mora biti proziran']),
      V('Cjelina i dijelovi','Koja je cjelina sastavljena od korijena, stabljike i listova?','biljka',['oblak','kamen','lokva'])
    ],
    place:[
      S('Mjesto u kojem živim','Što može biti dio naselja?','ulica',['ocean na Mjesecu','nevidljivi grad','oblak kao kuća']),
      M('Ustanova i uloga','Spoji ustanovu s ulogom.',[['dom zdravlja','briga o zdravlju'],['knjižnica','posudba knjiga'],['vatrogasna postaja','pomoć pri požaru'],['pošta','slanje pošiljaka']]),
      Z('Prirodno ili izgrađeno','Razvrstaj obilježja mjesta.',{prirodno:['rijeka','brdo','šuma'],izgrađeno:['most','škola','cesta']}),
      O('Istražujem svoje mjesto','Složi postupak.',['odaberi što želiš saznati','pronađi siguran izvor','promatraj uz odraslu osobu','zapiši važne podatke','predstavi što si otkrio']),
      C('Zanimanja u mjestu','Zašto su različita zanimanja važna?','zadovoljavaju različite potrebe zajednice',['sva rade isti posao','uklanjaju sva pravila','čine da nitko ne surađuje']),
      V('Krajolik mjesta','Koji opis sadrži i prirodno i izgrađeno obilježje?','rijeka prolazi pokraj mosta',['samo tri kuće','samo šumsko drveće','samo parkirani automobili']),
      T('Od rada do štednje','Poredaj smisleni slijed.',['osoba obavi posao','za rad primi zaradu','dio novca koristi za potrebe','dio odvoji','uštedu čuva za budući cilj']),
      S('Baština','Što znači čuvati baštinu?','brinuti o vrijednim prirodnim i kulturnim obilježjima',['uništiti stare predmete','sakriti sve od zajednice','mijenjati bez istraživanja']),
      M('Zanimanje i posao','Spoji zanimanje s poslom.',[['liječnik','pomaže bolesnima'],['učitelj','poučava'],['poljoprivrednik','uzgaja biljke ili životinje'],['graditelj','gradi i popravlja građevine']]),
      Z('Kulturno ili prirodno','Razvrstaj baštinu.',{kulturno:['stara gradska jezgra','narodna nošnja','tradicijska pjesma'],prirodno:['zaštićena šuma','rijetka biljka','poseban slap']}),
      C('Čuvamo vodu','Zašto ne bacamo otpad u potok ili rijeku?','štetimo vodi i živim bićima',['voda postane viša samo taj dan','most promijeni boju','ribe nauče letjeti']),
      V('Blagdan i običaj','Koji je primjer blagdanskog ili tradicijskog običaja zajednice?','zajedničko obilježavanje uz poštovanje drugih',['bacanje otpada nakon slavlja','vrijeđanje tuđih običaja','uništavanje ukrasa u mjestu'])
    ]
  };

  const take={easy:2,medium:3,hard:4};
  const sortTake={easy:1,medium:2,hard:3};
  const prefix={easy:'',medium:'Poveži više tragova. ',hard:'Promisli o cijeloj situaciji. '};

  function groupedSteps(steps,level){
    if(level==='hard') return steps.slice();
    if(level==='medium') return [steps[0],steps[1],`${steps[2]}, zatim ${steps[3]}`,steps[4]];
    return [`${steps[0]}, zatim ${steps[1]}`,`${steps[2]}, zatim ${steps[3]}`,steps[4]];
  }

  function hardDecision(base,def,wrong,rng){
    const label=def.type==='observe'?'Opažam':def.type==='cause'?'Zaključak':'Odabir';
    const answer=`${label}: ${def.correct} · Odbacujem: ${wrong[0]}`;
    const options=[answer,`${label}: ${wrong[0]} · Odbacujem: ${def.correct}`,`${label}: ${wrong[1]} · Odbacujem: ${wrong[2]}`,`${label}: ${wrong[2]} · Odbacujem: ${wrong[1]}`];
    return {...base,prompt:`Usporedi dvije odluke ili posljedice. ${def.prompt} Odaberi par koji najbolje odgovara svim tragovima.`,options:E.shuffle(options,rng),answer};
  }

  function makeQuestion(world,level,def,index,rng){
    const meta=worlds.find(item=>item.id===world);
    const base={id:`${world}-${level}-${index}`,world,level,type:def.type,title:def.title,prompt:prefix[level]+def.prompt};
    if(['single','cause','observe'].includes(def.type)){
      const wrong=E.shuffle(def.wrong,rng);
      const question=level==='hard'?hardDecision(base,def,wrong,rng):{...base,options:E.shuffle([def.correct,...wrong.slice(0,level==='easy'?2:3)],rng),answer:def.correct};
      return def.type==='observe'?{...question,scene:[meta.icon,meta.name]}:question;
    }
    if(def.type==='match'){
      const pairs=E.shuffle(def.pairs,rng).slice(0,take[level]);
      return {...base,left:E.shuffle(pairs.map(pair=>pair[0]),rng),right:E.shuffle(pairs.map(pair=>pair[1]),rng),answer:pairs.map(pair=>pair.slice())};
    }
    if(def.type==='sort'){
      const answer={};
      for(const [name,items] of Object.entries(def.zones)) answer[name]=E.shuffle(items,rng).slice(0,sortTake[level]);
      return {...base,zones:Object.keys(answer),items:E.shuffle(Object.values(answer).flat(),rng),answer};
    }
    const answer=groupedSteps(def.steps,level);
    return {...base,prompt:`${prefix[level]}Složi cjelovit predloženi redoslijed. ${def.prompt}`,items:E.shuffle(answer,rng),answer};
  }

  const templates={};
  for(const world of worlds){
    templates[world.id]={};
    for(const level of levels) templates[world.id][level.id]=banks[world.id].map((definition,index)=>(rng)=>makeQuestion(world.id,level.id,definition,index,rng));
  }

  function templateCount(){return worlds.reduce((sum,world)=>sum+levels.reduce((total,level)=>total+templates[world.id][level.id].length,0),0);}

  function buildRound(level,world,seed){
    if(!levels.some(item=>item.id===level)) throw new Error('Nepoznata razina.');
    const rng=E.makeRng(seed);
    if(world==='mix') return E.shuffle(worlds.map(item=>{const list=templates[item.id][level];return list[Math.floor(rng()*list.length)](rng);}),rng);
    if(!templates[world]) throw new Error('Nepoznati svijet.');
    return E.shuffle(templates[world][level],rng).slice(0,5).map(factory=>factory(rng));
  }

  return {levels,worlds,templates,templateCount,buildRound};
});
</script>
  <script>(function(){
  'use strict';
  const E=window.WorldEngine,C=window.WorldContent,app=document.getElementById('app'),announcer=document.getElementById('announcer');
  const storageKey='world-explorers-session-v1';
  let view='home',level='easy',session=load(),draft=null,pending=null,lastSeed=0;

  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const button=(label,action,className='button',extra='')=>`<button type="button" class="${className}" data-action="${action}" ${extra}>${label}</button>`;
  const lumi=(className='')=>`<svg class="lumi ${className}" viewBox="0 0 190 190" role="img" aria-label="Lumi, znatiželjna krijesnica"><ellipse cx="61" cy="79" rx="34" ry="48" fill="#dff3ff" stroke="#163d31" stroke-width="6" transform="rotate(-28 61 79)"/><ellipse cx="129" cy="79" rx="34" ry="48" fill="#dff3ff" stroke="#163d31" stroke-width="6" transform="rotate(28 129 79)"/><ellipse cx="95" cy="103" rx="34" ry="58" fill="#f6c84b" stroke="#163d31" stroke-width="6"/><path d="M68 105h54M70 128h50" stroke="#163d31" stroke-width="7"/><circle cx="84" cy="76" r="6" fill="#163d31"/><circle cx="106" cy="76" r="6" fill="#163d31"/><path d="M83 91c7 6 17 6 24 0" fill="none" stroke="#163d31" stroke-width="5" stroke-linecap="round"/><path d="M79 49 65 31m46 18 14-18" stroke="#163d31" stroke-width="5" stroke-linecap="round"/><circle cx="64" cy="29" r="5" fill="#c9484b"/><circle cx="126" cy="29" r="5" fill="#c9484b"/><circle cx="95" cy="157" r="23" fill="#fff4ad" opacity=".8"/></svg>`;

  function load(){try{return E.restore(localStorage.getItem(storageKey),C.buildRound);}catch(error){return null;}}
  function save(){if(!session)return;try{localStorage.setItem(storageKey,E.serialize(session));}catch(error){}}
  function seed(){const values=new Uint32Array(1);crypto.getRandomValues(values);let next=values[0]||Date.now();if(next===lastSeed)next=(next+1)>>>0;lastSeed=next;return next;}
  function current(){return session?.questions?.[session.index]||null;}
  function emptyDraft(question){
    if(['single','cause','observe'].includes(question.type))return{selected:''};
    if(question.type==='match')return{pairs:[]};
    if(question.type==='sort')return{zones:Object.fromEntries(question.zones.map(zone=>[zone,[]]))};
    return{items:[]};
  }
  function announce(message){announcer.textContent='';setTimeout(()=>{announcer.textContent=message;},0);}
  function focusMain(){try{app.focus({preventScroll:true});}catch(error){app.focus();}}

  function home(){
    const resume=session&&session.phase!=='complete'?`<aside class="resume"><div><strong>Lumi čuva tvoju ekspediciju.</strong><p>${C.levels.find(item=>item.id===session.level).name} · ${E.summarize(session).solved} od ${session.questions.length} riješeno</p></div>${button('Nastavi ekspediciju →','resume','button secondary')}</aside>`:'';
    return `<section class="home-view"><div class="hero"><div><p class="eyebrow">Priroda · Društvo · Velika otkrića</p><h1>Istraži svijet<br>uz krijesnicu <span>Lumi.</span></h1><p>Jedanaest svjetova vodi te kroz cijelu školsku godinu. Odaberi razinu i kreni tragom znanja.</p></div><div class="hero-art">${lumi('hero-lumi')}<span class="spark one">✦</span><span class="spark two">✧</span></div></div><h2 class="section-title">Odaberi razinu</h2><div class="level-grid">${C.levels.map((item,index)=>`<article class="level-card l${index+1}"><span class="level-index">0${index+1}</span><span class="level-icon" aria-hidden="true">${item.icon}</span><h3>${item.name}</h3><p>${item.desc}</p>${button('Odaberi →','level','button',`data-level="${item.id}"`)}</article>`).join('')}</div>${resume}</section>`;
  }

  function worlds(){
    const selected=C.levels.find(item=>item.id===level);
    return `<section><div class="topline">${button('← Početna','home','text-button')}<span class="pill">${selected.name}</span></div><div class="section-heading"><p class="eyebrow">Jedanaest svjetova znanja</p><h1>Što želiš istraživati?</h1><p>Svaki svijet donosi pet novih zadataka.</p></div><div class="world-grid">${C.worlds.map(world=>`<button type="button" class="world-card" data-world="${world.id}"><span class="world-icon" aria-hidden="true">${world.icon}</span><span><strong>${world.name}</strong><small>${world.desc}</small></span><b aria-hidden="true">→</b></button>`).join('')}<button type="button" class="world-card mixed" data-world="mix"><span class="world-icon" aria-hidden="true">🎒</span><span><strong>Miješana ekspedicija</strong><small>Po jedan zadatak iz svih jedanaest svjetova</small></span><b aria-hidden="true">→</b></button></div></section>`;
  }

  function progress(){
    const total=session.questions.length,done=E.summarize(session).solved;
    return `<div class="topline">${button('← Svjetovi','worlds','text-button')}<span class="pill">${C.levels.find(item=>item.id===session.level).name}</span></div><div class="progress-row"><div class="progress" role="progressbar" aria-label="Napredak" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">${session.questions.map((question,index)=>`<span class="${session.solved[index]?'done':index===session.index?'current':''}"></span>`).join('')}</div><span class="progress-text">Zadatak ${session.index+1} od ${total}</span></div>`;
  }

  function optionButton(value,selected){return `<button type="button" class="choice ${selected?'selected':''}" data-choice data-value="${esc(value)}" aria-pressed="${selected?'true':'false'}"><span class="radio" aria-hidden="true"></span>${esc(value)}</button>`;}
  function choices(question){return `<div class="choices">${question.options.map(value=>optionButton(value,draft.selected===value)).join('')}</div>`;}
  function observation(question){const scene=question.scene||['🔎','Opažanje'];return `<div class="observation"><div class="observation-scene"><span aria-hidden="true">${esc(scene[0])}</span><strong>${esc(scene[1])}</strong><small>Promotri tragove u opisu i odaberi zaključak.</small></div><div class="observation-options">${question.options.map(value=>optionButton(value,draft.selected===value)).join('')}</div></div>`;}
  function match(question){
    const usedLeft=new Set(draft.pairs.map(pair=>pair[0])),usedRight=new Set(draft.pairs.map(pair=>pair[1]));
    return `<p class="instruction">Odaberi pojam iz prve skupine, zatim njegov par iz druge.</p><div class="match-grid"><div>${question.left.filter(value=>!usedLeft.has(value)).map(value=>`<button type="button" class="tile ${pending===value?'selected':''}" data-match-left data-value="${esc(value)}" aria-pressed="${pending===value?'true':'false'}">${esc(value)}</button>`).join('')||'<p class="empty-note">Svi pojmovi su spojeni.</p>'}</div><div>${question.right.filter(value=>!usedRight.has(value)).map(value=>`<button type="button" class="tile" data-match-right data-value="${esc(value)}">${esc(value)}</button>`).join('')}</div></div><div class="pair-list">${draft.pairs.map((pair,index)=>`<button type="button" data-remove-pair="${index}" aria-label="Ukloni par ${esc(pair.join(' i '))}"><span>${esc(pair[0])}</span><b>↔</b><span>${esc(pair[1])}</span><i aria-hidden="true">×</i></button>`).join('')}</div>`;
  }
  function sort(question){
    const assigned=new Set(Object.values(draft.zones).flat());
    return `<p class="instruction">Odaberi karticu, zatim polje u koje pripada.</p><div class="item-tray">${question.items.filter(item=>!assigned.has(item)).map(item=>`<button type="button" class="tile ${pending===item?'selected':''}" data-sort-item data-value="${esc(item)}" aria-pressed="${pending===item?'true':'false'}">${esc(item)}</button>`).join('')||'<p class="empty-note">Sve kartice su razvrstane.</p>'}</div><div class="zone-grid">${question.zones.map(zone=>`<div class="zone"><button type="button" class="zone-target" data-sort-zone data-value="${esc(zone)}"><strong>${esc(zone.replaceAll('_',' '))}</strong><small>Dodaj odabranu karticu</small></button><div class="zone-items">${draft.zones[zone].map((item,index)=>`<button type="button" data-remove-sort="${esc(zone)}:${index}" aria-label="Ukloni ${esc(item)} iz polja ${esc(zone.replaceAll('_',' '))}"><span>${esc(item)}</span><i aria-hidden="true">×</i></button>`).join('')}</div></div>`).join('')}</div>`;
  }
  function remaining(question){const used=new Map();draft.items.forEach(item=>used.set(item,(used.get(item)||0)+1));return question.items.filter(item=>{const count=used.get(item)||0;if(count){used.set(item,count-1);return false;}return true;});}
  function sequence(question){const timeline=question.type==='timeline';return `<p class="instruction">${timeline?'Poredaj događaje od ranijega prema kasnijemu.':'Odaberi kartice redom kojim se radnje trebaju dogoditi.'}</p><div class="sequence-answer ${timeline?'time-line':''}">${draft.items.map((item,index)=>`<button type="button" data-remove-sequence="${index}" aria-label="Ukloni korak ${index+1}"><b>${index+1}</b><span>${esc(item)}</span><i aria-hidden="true">×</i></button>`).join('')||'<p>Ovdje će se pojaviti tvoj redoslijed.</p>'}</div><div class="item-tray">${remaining(question).map(item=>`<button type="button" class="tile" data-sequence-item data-value="${esc(item)}">${esc(item)}</button>`).join('')}</div>`;}
  function answerArea(question){if(question.type==='observe')return observation(question);if(['single','cause'].includes(question.type))return choices(question);if(question.type==='match')return match(question);if(question.type==='sort')return sort(question);return sequence(question);}

  function results(){const stats=E.summarize(session);return `<section class="results"><div class="results-hero">${lumi('results-lumi')}<div><p class="eyebrow">Ekspedicija je dovršena</p><h1>Bravo, istraživačice!</h1><p>Riješila si svih ${stats.total} zadataka.</p></div></div><div class="stats"><article class="stat"><strong>${stats.firstTry}</strong><span>Iz prvog pokušaja</span></article><article class="stat warm"><strong>${stats.retried}</strong><span>Uz ponovni pokušaj</span></article></div><p class="encouragement">Lumi kaže: svako dobro pitanje vodi prema novom otkriću.</p><div class="actions centered">${button('Nova ekspedicija →','new-round')}${button('Promijeni svijet','worlds','button secondary')}</div></section>`;}

  function play(){
    if(session.phase==='complete')return results();
    const question=current(),world=C.worlds.find(item=>item.id===question.world);
    if(session.phase==='incorrect')return `<section class="exercise">${progress()}<div class="question-card"><div class="feedback incorrect"><span aria-hidden="true">↻</span><div><p class="eyebrow">Pokušaj ponovno</p><h1>Pogledaj još jednom.</h1><p>Odgovor još nije točan. Mirno provjeri tragove i svoj izbor.</p></div>${lumi('feedback-lumi')}</div><div class="actions">${button('Pokušaj ponovno','retry')}</div></div></section>`;
    if(session.phase==='correct')return `<section class="exercise">${progress()}<div class="question-card"><div class="feedback correct"><span aria-hidden="true">✓</span><div><p class="eyebrow">Zadatak riješen</p><h1>Točno!</h1><p>Dobro si povezala tragove.</p></div>${lumi('feedback-lumi')}</div><div class="actions">${button(session.index===session.questions.length-1?'Pogledaj rezultat →':'Sljedeći zadatak →','next')}</div></div></section>`;
    if(!draft)draft=emptyDraft(question);
    return `<section class="exercise">${progress()}<div class="question-card"><div class="question-head"><span class="question-icon" aria-hidden="true">${world.icon}</span><div><p class="eyebrow">${world.name}</p><h1>${esc(question.title)}</h1></div></div><p class="prompt">${esc(question.prompt)}</p>${answerArea(question)}<div class="actions"><button id="check-button" class="button" type="button" data-action="check" ${E.complete(question,draft)?'':'disabled'}>Provjeri</button></div></div></section>`;
  }

  function render(focusPicker){app.innerHTML=view==='home'?home():view==='worlds'?worlds():play();const node=typeof focusPicker==='function'?focusPicker():null;if(node)node.focus();else focusMain();}
  const focusValue=(selector,value)=>()=>[...app.querySelectorAll(selector)].find(node=>node.dataset.value===value)||null;
  const focusFirst=selector=>()=>app.querySelector(selector);
  function start(world){
    const previous=session&&session.level===level&&session.world===world?new Set(session.questions.map(question=>question.id)):new Set();
    const baseSeed=seed();let selected=null,best=null,bestOverlap=Infinity;
    for(let attempt=0;attempt<64;attempt++){
      const trialSeed=(baseSeed+Math.imul(attempt,0x9e3779b1))>>>0,questions=C.buildRound(level,world,trialSeed);
      const overlap=questions.reduce((total,question)=>total+(previous.has(question.id)?1:0),0);
      if(overlap<bestOverlap){best={seed:trialSeed,questions};bestOverlap=overlap;}
      if(overlap===0){selected=best;break;}
    }
    selected=selected||best;session=E.createSession(level,world,selected.seed,selected.questions);draft=null;pending=null;save();view='play';render();
  }
  function choose(value){draft.selected=value;render(focusValue('[data-choice]',value));}
  function matchLeft(value){pending=value;render(focusValue('[data-match-left]',value));}
  function matchRight(value){if(!pending)return;draft.pairs.push([pending,value]);pending=null;render(focusFirst('[data-match-left], [data-remove-pair]'));}
  function sortItem(value){pending=value;render(focusValue('[data-sort-item]',value));}
  function sortZone(zone){if(!pending)return;draft.zones[zone].push(pending);pending=null;render(focusFirst('[data-sort-item], [data-remove-sort]'));}

  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.level){level=target.dataset.level;view='worlds';render();return;}
    if(target.dataset.world){start(target.dataset.world);return;}
    if(target.hasAttribute('data-choice')){choose(target.dataset.value);return;}
    if(target.hasAttribute('data-match-left')){matchLeft(target.dataset.value);return;}
    if(target.hasAttribute('data-match-right')){matchRight(target.dataset.value);return;}
    if(target.hasAttribute('data-sort-item')){sortItem(target.dataset.value);return;}
    if(target.hasAttribute('data-sort-zone')){sortZone(target.dataset.value);return;}
    if(target.hasAttribute('data-sequence-item')){draft.items.push(target.dataset.value);render(focusFirst('[data-sequence-item], [data-remove-sequence]'));return;}
    if(target.dataset.removePair!==undefined){draft.pairs.splice(Number(target.dataset.removePair),1);render(focusFirst('[data-match-left]'));return;}
    if(target.dataset.removeSort!==undefined){const [zone,index]=target.dataset.removeSort.split(':'),item=draft.zones[zone][Number(index)];draft.zones[zone].splice(Number(index),1);render(focusValue('[data-sort-item]',item));return;}
    if(target.dataset.removeSequence!==undefined){const [item]=draft.items.splice(Number(target.dataset.removeSequence),1);render(focusValue('[data-sequence-item]',item));return;}
    const action=target.dataset.action;
    if(action==='home'){view='home';render();}
    if(action==='worlds'){level=session?.level||level;view='worlds';render();}
    if(action==='resume'){level=session.level;draft=session.responses[session.index]||null;view='play';render();}
    if(action==='check'){const result=E.submit(session,draft);save();if(result==='incorrect')announce('Pogledaj još jednom.');if(result==='correct')announce('Točno!');render();}
    if(action==='retry'){session.phase='answer';session.responses[session.index]=null;draft=null;pending=null;save();render();}
    if(action==='next'){E.advance(session);draft=null;pending=null;save();render();}
    if(action==='new-round')start(session.world);
  });

  render();
})();
</script>
</body>
</html>
