  <header class="site-header">
    <button class="brand" type="button" data-action="home" aria-label="Informatička pustolovina – početna"><span aria-hidden="true">🤖</span><strong>Informatička pustolovina</strong></button>

  <script>(function(root,factory){
  const api=factory();
  if(typeof module==='object'&&module.exports) module.exports=api;
  else root.InfoEngine=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  'use strict';

  const VERSION=1;
  const text=value=>String(value??'').trim().replace(/\s+/g,' ').toLocaleLowerCase('hr');
  const clone=value=>JSON.parse(JSON.stringify(value));

  function makeRng(seed){
    let state=(Number(seed)>>>0)||0x6d2b79f5;
    return function(){
      state+=0x6d2b79f5;
      let t=state;
      t=Math.imul(t^(t>>>15),t|1);
      t^=t+Math.imul(t^(t>>>7),t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }

  function shuffle(values,rng=Math.random){
    const copy=values.slice();
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(rng()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function pairKey(pair){return `${text(pair?.[0])}\u0000${text(pair?.[1])}`;}
  function normalizedZones(zones,names){
    if(!zones||typeof zones!=='object') return null;
    const out={};
    for(const name of names){
      if(!Array.isArray(zones[name])) return null;
      out[text(name)]=zones[name].map(text).sort();
    }
    return out;
  }

  function complete(question,response){
    if(!question||!response||typeof response!=='object') return false;
    if(['single','debug','sim'].includes(question.type)) return Boolean(text(response.selected));
    if(question.type==='match') return Array.isArray(response.pairs)&&response.pairs.length===question.answer.length&&response.pairs.every(p=>Array.isArray(p)&&p.length===2&&text(p[0])&&text(p[1]));
    if(question.type==='sort'){
      if(!response.zones||typeof response.zones!=='object') return false;
      return Object.keys(question.answer).every(name=>Array.isArray(response.zones[name]))&&Object.values(response.zones).flat().length===Object.values(question.answer).flat().length;
    }
    if(question.type==='order') return Array.isArray(response.items)&&response.items.length===question.answer.length&&response.items.every(v=>text(v));
    return false;
  }

  function check(question,response){
    if(!complete(question,response)) return false;
    if(['single','debug','sim'].includes(question.type)) return text(response.selected)===text(question.answer);
    if(question.type==='match'){
      const expected=question.answer.map(pairKey).sort();
      const actual=response.pairs.map(pairKey).sort();
      return new Set(actual).size===actual.length&&JSON.stringify(actual)===JSON.stringify(expected);
    }
    if(question.type==='sort'){
      const names=Object.keys(question.answer);
      const expected=normalizedZones(question.answer,names);
      const actual=normalizedZones(response.zones,names);
      if(!actual) return false;
      const values=Object.values(actual).flat();
      return new Set(values).size===values.length&&JSON.stringify(actual)===JSON.stringify(expected);
    }
    if(question.type==='order') return question.answer.every((value,index)=>text(value)===text(response.items[index]));
    return false;
  }

  function createSession(level,world,seed,questions){
    if(!Array.isArray(questions)||questions.length===0) throw new Error('Runda mora sadržavati zadatke.');
    return {version:VERSION,level,world,seed:Number(seed)>>>0,questions:clone(questions),index:0,phase:'answer',attempts:questions.map(()=>0),solved:questions.map(()=>false),responses:questions.map(()=>null)};
  }

  function submit(session,response){
    const index=session.index;
    if(session.solved[index]) return 'locked';
    const question=session.questions[index];
    if(!complete(question,response)) return 'empty';
    session.attempts[index]+=1;
    session.responses[index]=clone(response);
    if(!check(question,response)){session.phase='incorrect';return 'incorrect';}
    session.solved[index]=true;
    session.phase='correct';
    return 'correct';
  }

  function advance(session){
    if(!session.solved[session.index]) return false;
    if(session.index>=session.questions.length-1){session.phase='complete';return true;}
    session.index+=1;
    session.phase='answer';
    return true;
  }

  function summarize(session){
    const solved=session.solved.filter(Boolean).length;
    let firstTry=0,retried=0;
    session.solved.forEach((done,index)=>{if(done){if(session.attempts[index]===1) firstTry+=1;else retried+=1;}});
    return {solved,total:session.questions.length,firstTry,retried};
  }

  function serialize(session){
    return JSON.stringify({version:VERSION,level:session.level,world:session.world,seed:session.seed,index:session.index,phase:session.phase,attempts:session.attempts,solved:session.solved,responses:session.responses});
  }

  function sameMembers(values,allowed){
    const counts=list=>list.reduce((map,value)=>map.set(text(value),(map.get(text(value))||0)+1),new Map());
    const actual=counts(values),expected=counts(allowed);
    for(const [value,count] of actual) if(!expected.has(value)||count>expected.get(value)) return false;
    return true;
  }

  function responseAllowed(question,response){
    if(response===null) return true;
    if(!response||typeof response!=='object') return false;
    if(['single','debug','sim'].includes(question.type)) return question.options.some(option=>text(option)===text(response.selected));
    if(question.type==='match') return Array.isArray(response.pairs)&&response.pairs.every(pair=>Array.isArray(pair)&&pair.length===2&&question.left.some(v=>text(v)===text(pair[0]))&&question.right.some(v=>text(v)===text(pair[1])));
    if(question.type==='sort'){
      if(!response.zones||typeof response.zones!=='object'||Object.keys(response.zones).some(name=>!question.zones.includes(name))) return false;
      if(Object.keys(response.zones).length!==question.zones.length||question.zones.some(name=>!Object.prototype.hasOwnProperty.call(response.zones,name))) return false;
      const values=Object.values(response.zones);
      return values.every(Array.isArray)&&sameMembers(values.flat(),question.items);
    }
    if(question.type==='order') return Array.isArray(response.items)&&sameMembers(response.items,question.items);
    return false;
  }

  function restore(raw,buildRound){
    try{
      const saved=typeof raw==='string'?JSON.parse(raw):raw;
      if(!saved||saved.version!==VERSION||typeof buildRound!=='function') return null;
      if(!Number.isInteger(saved.seed)||saved.seed<0||!Number.isInteger(saved.index)) return null;
      const questions=buildRound(saved.level,saved.world,saved.seed);
      const total=questions.length;
      if(saved.index<0||saved.index>=total||!['answer','incorrect','correct','complete'].includes(saved.phase)) return null;
      if(!Array.isArray(saved.attempts)||!Array.isArray(saved.solved)||!Array.isArray(saved.responses)||saved.attempts.length!==total||saved.solved.length!==total||saved.responses.length!==total) return null;
      if(saved.attempts.some(v=>!Number.isInteger(v)||v<0)||saved.solved.some(v=>typeof v!=='boolean')) return null;
      for(let i=0;i<total;i++){
        if(!responseAllowed(questions[i],saved.responses[i])) return null;
        if(i<saved.index){if(!saved.solved[i]||saved.attempts[i]<1||!check(questions[i],saved.responses[i])) return null;}
        if(i>saved.index){if(saved.solved[i]||saved.attempts[i]!==0||saved.responses[i]!==null) return null;}
      }
      const current=saved.index;
      if(saved.phase==='incorrect'&&(saved.solved[current]||saved.attempts[current]<1||!complete(questions[current],saved.responses[current])||check(questions[current],saved.responses[current]))) return null;
      if(saved.phase==='correct'&&(!saved.solved[current]||saved.attempts[current]<1||!check(questions[current],saved.responses[current]))) return null;
      if(saved.phase==='answer'&&saved.solved[current]) return null;
      if(saved.phase==='complete'&&(current!==total-1||saved.solved.some(v=>!v)||!check(questions[current],saved.responses[current]))) return null;
      const session=createSession(saved.level,saved.world,saved.seed,questions);
      session.index=current; session.phase=saved.phase; session.attempts=saved.attempts.slice(); session.solved=saved.solved.slice(); session.responses=clone(saved.responses);
      return session;
    }catch(error){return null;}
  }

  return {VERSION,makeRng,shuffle,complete,check,createSession,submit,advance,summarize,serialize,restore};
});
</script>

      M('Zanimanje i tehnologija','Spoji zanimanje s primjerom uporabe tehnologije.',[['liječnik','pregledava zdravstvene podatke u sigurnom sustavu'],['arhitekt','izrađuje nacrt'],['učitelj','priprema digitalni zadatak'],['vozač','koristi kartu za put'],['dizajner','stvara vizualni rad']]),
      Z('Prije ili tijekom videosastanka','Razvrstaj ponašanja.',{primjereno:['čekam svoj red','utišam mikrofon kada ne govorim','koristim dogovoreno ime','pratim upute učitelja'],neprimjereno:['prekidam druge','dijelim poveznicu nepoznatima','snimam bez dopuštenja','pokazujem osobne podatke']}),
      O('Predajem školski rad','Složi korake.',['dovrši rad','spremi jasnim nazivom','otvori sigurnu mrežnu učionicu','odaberi dogovoreno mjesto za predaju','provjeri je li datoteka poslana']),
      D('Zajednički rad','Koja radnja ometa suradnju?','izbrišem tuđi dio bez pitanja',['dogovorim zadatke','slušam prijedlog druge osobe','pitam prije promjene tuđeg dijela']),
      X('Priča treba sliku','Koji je najbolji izbor?','dodati vlastiti crtež ili dopuštenu sliku',['uzeti bilo koju tuđu sliku bez pitanja','objaviti osobnu fotografiju prijatelja','upisati lozinku u dokument'])
    ]
  };

  const takeCount={easy:2,medium:3,hard:4};
  const orderCount={easy:3,medium:4,hard:5};
  const prefix={easy:'',medium:'Poveži više informacija. ',hard:'Promisli o cijeloj situaciji. '};
  const scenes={computer:['🔊','Upravljanje uređajem'],programs:['📁','Rad s datotekom'],internet:['🌐','Mrežni preglednik'],safety:['🛡️','Sigurnosna odluka'],traces:['💬','Objava na mreži'],algorithm:['🤖','Robot slijedi upute'],scratch:['🐱','Scratch pozornica'],create:['🎨','Digitalna radionica']};

  function orderedActivity(steps,level){
    if(level==='hard') return steps.slice();
    if(level==='medium') return [steps[0],steps[1],`${steps[2]}, zatim ${steps[3]}`,steps[4]];
    return [`${steps[0]}, zatim ${steps[1]}`,`${steps[2]}, zatim ${steps[3]}`,steps[4]];
  }

  function hardDecision(base,def,wrong,rng){
    if(def.type==='debug'){
      const answer=`Problem: ${def.correct} · Bolji izbor: ${wrong[0]}`;
      const options=[answer,`Problem: ${wrong[0]} · Bolji izbor: ${def.correct}`,`Problem: ${wrong[1]} · Bolji izbor: ${wrong[2]}`,`Problem: ${wrong[2]} · Bolji izbor: ${wrong[1]}`];
      return {...base,prompt:`Usporedi problem i bolji postupak. ${def.prompt} Odaberi par koji prepoznaje pogrešku i ispravlja je.`,options:E.shuffle(options,rng),answer};
    }
    const answer=`Učini: ${def.correct} · Izbjegni: ${wrong[0]}`;
    const options=[answer,`Učini: ${wrong[0]} · Izbjegni: ${def.correct}`,`Učini: ${wrong[1]} · Izbjegni: ${wrong[2]}`,`Učini: ${wrong[2]} · Izbjegni: ${wrong[1]}`];
    return {...base,prompt:`Usporedi dvije odluke. ${def.prompt} Odaberi par koji pokazuje što treba učiniti i što treba izbjegavati.`,options:E.shuffle(options,rng),answer};
  }

  function makeQuestion(world,level,def,index,rng){
    const base={id:`${world}-${level}-${index}`,world,level,type:def.type,title:def.title,prompt:prefix[level]+def.prompt};
    if(['single','debug','sim'].includes(def.type)){
      const wrong=E.shuffle(def.wrong,rng);
      const question=level==='hard'?hardDecision(base,def,wrong,rng):{...base,options:E.shuffle([def.correct,...wrong.slice(0,level==='easy'?2:3)],rng),answer:def.correct};
      return def.type==='sim'?{...question,scene:scenes[world]}:question;
    }
    if(def.type==='match'){
      const pairs=E.shuffle(def.pairs,rng).slice(0,takeCount[level]);
      return {...base,left:E.shuffle(pairs.map(p=>p[0]),rng),right:E.shuffle(pairs.map(p=>p[1]),rng),answer:pairs.map(p=>p.slice())};
    }
    if(def.type==='sort'){
      const answer={};
      for(const [name,items] of Object.entries(def.zones)) answer[name]=E.shuffle(items,rng).slice(0,takeCount[level]);
      return {...base,zones:Object.keys(answer),items:E.shuffle(Object.values(answer).flat(),rng),answer};
    }
    const answer=orderedActivity(def.steps,level);
    return {...base,prompt:`${prefix[level]}Složi Bitkov predloženi redoslijed. ${def.prompt}`,items:E.shuffle(answer,rng),answer};
  }

  const templates={};
  for(const world of worlds){
    templates[world.id]={};
    for(const level of levels){
      templates[world.id][level.id]=banks[world.id].map((def,index)=>(rng)=>makeQuestion(world.id,level.id,def,index,rng));
    }
  }

  function templateCount(){
    return worlds.reduce((sum,world)=>sum+levels.reduce((n,level)=>n+templates[world.id][level.id].length,0),0);
  }

  function buildRound(level,world,seed){
    if(!levels.some(item=>item.id===level)) throw new Error('Nepoznata razina.');
    const rng=E.makeRng(seed);
    if(world==='mix'){
      return E.shuffle(worlds.map(item=>{
        const list=templates[item.id][level];
        return list[Math.floor(rng()*list.length)](rng);
      }),rng);
    }
    if(!templates[world]) throw new Error('Nepoznati svijet.');
    return E.shuffle(templates[world][level],rng).slice(0,5).map(factory=>factory(rng));
  }

  return {levels,worlds,templates,templateCount,buildRound};
});
</script>
  <script>(function(){
  'use strict';
  const E=window.InfoEngine,C=window.InfoContent;
  const app=document.getElementById('app'),announcer=document.getElementById('announcer');
  const storageKey='info-adventure-session-v1';
  let view='home',level='easy',session=load(),draft=null,pending=null,lastSeed=0;

  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const button=(label,action,className='button',extra='')=>`<button type="button" class="${className}" data-action="${action}" ${extra}>${label}</button>`;
  const bitko=(className='')=>`<svg class="bitko ${className}" viewBox="0 0 180 180" role="img" aria-label="Bitko, mali robot vodič"><path d="M42 65c0-24 19-43 43-43h10c24 0 43 19 43 43v19H42V65Z" fill="#dff7f2" stroke="#12364a" stroke-width="6"/><rect x="27" y="74" width="126" height="82" rx="30" fill="#fff" stroke="#12364a" stroke-width="6"/><circle cx="67" cy="106" r="11" fill="#0c6e78"/><circle cx="113" cy="106" r="11" fill="#0c6e78"/><path d="M66 133c14 11 34 11 48 0" fill="none" stroke="#12364a" stroke-width="6" stroke-linecap="round"/><path d="M90 22V9" stroke="#12364a" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="7" r="6" fill="#f2b544"/><path d="M27 100H12m141 0h15" stroke="#12364a" stroke-width="7" stroke-linecap="round"/></svg>`;

  function load(){try{return E.restore(localStorage.getItem(storageKey),C.buildRound);}catch(error){return null;}}
  function save(){if(!session)return;try{localStorage.setItem(storageKey,E.serialize(session));}catch(error){}}
  function seed(){const values=new Uint32Array(1);crypto.getRandomValues(values);let next=values[0]||Date.now();if(next===lastSeed)next=(next+1)>>>0;lastSeed=next;return next;}
  function emptyDraft(q){if(['single','debug','sim'].includes(q.type))return{selected:''};if(q.type==='match')return{pairs:[]};if(q.type==='sort')return{zones:Object.fromEntries(q.zones.map(zone=>[zone,[]]))};return{items:[]};}
  function current(){return session?.questions?.[session.index]||null;}
  function announce(text){announcer.textContent='';setTimeout(()=>{announcer.textContent=text;},0);}
  function focusMain(){try{app.focus({preventScroll:true});}catch(error){app.focus();}}

  function home(){
    const resume=session&&session.phase!=='complete'?`<aside class="resume"><div><strong>Bitko čuva tvoju vježbu.</strong><p>${C.levels.find(l=>l.id===session.level).name} · ${E.summarize(session).solved} od ${session.questions.length} riješeno</p></div>${button('Nastavi vježbu →','resume','button secondary')}</aside>`:'';
    return `<section class="home-view"><div class="hero"><div><p class="eyebrow">Digitalni svijet · Velike ideje</p><h1>Upoznaj računalo<br>uz prijatelja <span>Bitka.</span></h1><p>Bitko te vodi kroz osam svjetova znanja. Odaberi razinu i uči kroz igru.</p></div><div class="hero-art">${bitko('hero-bitko')}<span class="spark one">✦</span><span class="spark two">✧</span></div></div><h2 class="section-title">Odaberi razinu</h2><div class="level-grid">${C.levels.map((item,index)=>`<article class="level-card l${index+1}"><span class="level-index">0${index+1}</span><span class="level-icon" aria-hidden="true">${item.icon}</span><h3>${item.name}</h3><p>${item.desc}</p>${button('Odaberi →','level','button',`data-level="${item.id}"`)}</article>`).join('')}</div>${resume}</section>`;
  }

  function worlds(){
    const selected=C.levels.find(item=>item.id===level);
    return `<section><div class="topline">${button('← Početna','home','text-button')}<span class="pill">${selected.name}</span></div><div class="section-heading"><p class="eyebrow">Osam svjetova znanja</p><h1>Što želiš vježbati?</h1><p>Svaki svijet ima pet novih zadataka.</p></div><div class="world-grid">${C.worlds.map(world=>`<button type="button" class="world-card" data-world="${world.id}"><span class="world-icon" aria-hidden="true">${world.icon}</span><span><strong>${world.name}</strong><small>${world.desc}</small></span><b aria-hidden="true">→</b></button>`).join('')}<button type="button" class="world-card mixed" data-world="mix"><span class="world-icon" aria-hidden="true">🎲</span><span><strong>Miješana vježba</strong><small>Po jedan zadatak iz svakog svijeta</small></span><b aria-hidden="true">→</b></button></div></section>`;
  }

  function progress(){
    const total=session.questions.length,done=E.summarize(session).solved;
    return `<div class="topline">${button('← Svjetovi','worlds','text-button')}<span class="pill">${C.levels.find(item=>item.id===session.level).name}</span></div><div class="progress-row"><div class="progress" role="progressbar" aria-label="Napredak" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">${session.questions.map((q,index)=>`<span class="${session.solved[index]?'done':index===session.index?'current':''}"></span>`).join('')}</div><span class="progress-text">Zadatak ${session.index+1} od ${total}</span></div>`;
  }

  function optionButton(value,selected){return `<button type="button" class="choice ${selected?'selected':''}" data-choice data-value="${esc(value)}" aria-pressed="${selected?'true':'false'}"><span class="radio" aria-hidden="true"></span>${esc(value)}</button>`;}
  function single(q){return `<div class="choices">${q.options.map(value=>optionButton(value,draft.selected===value)).join('')}</div>`;}
  function match(q){
    const usedLeft=new Set(draft.pairs.map(pair=>pair[0])),usedRight=new Set(draft.pairs.map(pair=>pair[1]));
    return `<p class="instruction">Odaberi pojam iz prve skupine, zatim njegov par iz druge.</p><div class="match-grid"><div>${q.left.filter(value=>!usedLeft.has(value)).map(value=>`<button type="button" class="tile ${pending===value?'selected':''}" data-match-left data-value="${esc(value)}" aria-pressed="${pending===value?'true':'false'}">${esc(value)}</button>`).join('')||'<p class="empty-note">Svi pojmovi su spojeni.</p>'}</div><div>${q.right.filter(value=>!usedRight.has(value)).map(value=>`<button type="button" class="tile" data-match-right data-value="${esc(value)}">${esc(value)}</button>`).join('')}</div></div><div class="pair-list">${draft.pairs.map((pair,index)=>`<button type="button" data-remove-pair="${index}" aria-label="Ukloni par ${esc(pair.join(' i '))}"><span>${esc(pair[0])}</span><b>↔</b><span>${esc(pair[1])}</span><i aria-hidden="true">×</i></button>`).join('')}</div>`;
  }
  function sort(q){
    const assigned=new Set(Object.values(draft.zones).flat());
    return `<p class="instruction">Odaberi karticu, zatim polje u koje pripada.</p><div class="item-tray">${q.items.filter(item=>!assigned.has(item)).map(item=>`<button type="button" class="tile ${pending===item?'selected':''}" data-sort-item data-value="${esc(item)}" aria-pressed="${pending===item?'true':'false'}">${esc(item)}</button>`).join('')||'<p class="empty-note">Sve kartice su razvrstane.</p>'}</div><div class="zone-grid">${q.zones.map(zone=>`<div class="zone"><button type="button" class="zone-target" data-sort-zone data-value="${esc(zone)}"><strong>${esc(zone.replaceAll('_',' '))}</strong><small>Dodaj odabranu karticu</small></button><div class="zone-items">${draft.zones[zone].map((item,index)=>`<button type="button" data-remove-sort="${esc(zone)}:${index}" aria-label="Ukloni ${esc(item)} iz polja ${esc(zone.replaceAll('_',' '))}"><span>${esc(item)}</span><i aria-hidden="true">×</i></button>`).join('')}</div></div>`).join('')}</div>`;
  }
  function remainingItems(q){const used=new Map();draft.items.forEach(item=>used.set(item,(used.get(item)||0)+1));return q.items.filter(item=>{const count=used.get(item)||0;if(count){used.set(item,count-1);return false;}return true;});}
  function order(q){return `<p class="instruction">Odabiri kartice redom kojim se radnje trebaju dogoditi.</p><div class="order-answer">${draft.items.map((item,index)=>`<button type="button" data-remove-order="${index}" aria-label="Ukloni korak ${index+1}"><b>${index+1}</b>${esc(item)}<i aria-hidden="true">×</i></button>`).join('')||'<p>Ovdje će se pojaviti tvoj redoslijed.</p>'}</div><div class="item-tray">${remainingItems(q).map(item=>`<button type="button" class="tile" data-order-item data-value="${esc(item)}">${esc(item)}</button>`).join('')}</div>`;}
  function simulation(q){const scene=q.scene||['🖥️','Digitalni zadatak'];return `<div class="simulator" role="group" aria-label="Interaktivna simulacija: ${esc(scene[1])}"><div class="sim-screen"><span aria-hidden="true">${esc(scene[0])}</span><strong>${esc(scene[1])}</strong><small>Odaberi naredbu ili postupak.</small></div><div class="sim-controls">${q.options.map(value=>optionButton(value,draft.selected===value)).join('')}</div></div>`;}
  function answerArea(q){if(q.type==='sim')return simulation(q);if(['single','debug'].includes(q.type))return single(q);if(q.type==='match')return match(q);if(q.type==='sort')return sort(q);return order(q);}

  function play(){
    const q=current(),world=C.worlds.find(item=>item.id===q.world);
    if(session.phase==='complete')return results();
    if(session.phase==='incorrect')return `<section class="exercise">${progress()}<div class="question-card"><div class="feedback incorrect"><span aria-hidden="true">↻</span><div><p class="eyebrow">Pokušaj ponovno</p><h1>Pogledaj još jednom.</h1><p>Odgovor još nije točan. Mirno provjeri svoj izbor.</p></div>${bitko('feedback-bitko')}</div><div class="actions">${button('Pokušaj ponovno','retry')}</div></div></section>`;
    if(session.phase==='correct')return `<section class="exercise">${progress()}<div class="question-card"><div class="feedback correct"><span aria-hidden="true">✓</span><div><p class="eyebrow">Zadatak riješen</p><h1>Točno!</h1><p>Dobro si povezala informacije.</p></div>${bitko('feedback-bitko')}</div><div class="actions">${button(session.index===session.questions.length-1?'Pogledaj rezultat →':'Sljedeći zadatak →','next')}</div></div></section>`;
    if(!draft)draft=emptyDraft(q);
    return `<section class="exercise">${progress()}<div class="question-card"><div class="question-head"><span class="question-icon" aria-hidden="true">${world.icon}</span><div><p class="eyebrow">${world.name}</p><h1>${esc(q.title)}</h1></div></div><p class="prompt">${esc(q.prompt)}</p>${answerArea(q)}<div class="actions"><button id="check-button" class="button" type="button" data-action="check" ${E.complete(q,draft)?'':'disabled'}>Provjeri</button></div></div></section>`;
  }

  function results(){
    const stats=E.summarize(session);
    return `<section class="results"><div class="results-hero">${bitko('results-bitko')}<div><p class="eyebrow">Vježba je dovršena</p><h1>Bravo, digitalna istraživačice!</h1><p>Riješila si svih ${stats.total} zadataka.</p></div></div><div class="stats"><article class="stat"><strong>${stats.firstTry}</strong><span>Iz prvog pokušaja</span></article><article class="stat warm"><strong>${stats.retried}</strong><span>Uz ponovni pokušaj</span></article></div><p class="encouragement">Bitko kaže: pogreška je samo novi trag do rješenja.</p><div class="actions centered">${button('Nova vježba →','new-round')}${button('Promijeni svijet','worlds','button secondary')}</div></section>`;
  }

  function render(focusPicker){app.innerHTML=view==='home'?home():view==='worlds'?worlds():play();const node=typeof focusPicker==='function'?focusPicker():null;if(node)node.focus();else focusMain();}
  const focusValue=(selector,value)=>()=>[...app.querySelectorAll(selector)].find(node=>node.dataset.value===value)||null;
  const focusFirst=selector=>()=>app.querySelector(selector);
  function start(world){
    const previous=session&&session.level===level&&session.world===world?new Set(session.questions.map(q=>q.id)):new Set();
    const baseSeed=seed();let chosen=null,best=null,bestOverlap=Infinity;
    for(let attempt=0;attempt<64;attempt++){
      const trialSeed=(baseSeed+Math.imul(attempt,0x9e3779b1))>>>0,questions=C.buildRound(level,world,trialSeed);
      const overlap=questions.reduce((sum,q)=>sum+(previous.has(q.id)?1:0),0);
      if(overlap<bestOverlap){best={seed:trialSeed,questions};bestOverlap=overlap;}
      if(overlap===0){chosen=best;break;}
    }
    chosen=chosen||best;session=E.createSession(level,world,chosen.seed,chosen.questions);draft=null;pending=null;save();view='play';render();
  }
  function choose(value){draft.selected=value;render(focusValue('[data-choice]',value));}
  function matchLeft(value){pending=value;render(focusValue('[data-match-left]',value));}
  function matchRight(value){if(!pending)return;draft.pairs.push([pending,value]);pending=null;render(focusFirst('[data-match-left], [data-remove-pair]'));}
  function sortItem(value){pending=value;render(focusValue('[data-sort-item]',value));}
  function sortZone(zone){if(!pending)return;draft.zones[zone].push(pending);pending=null;render(focusFirst('[data-sort-item], [data-remove-sort]'));}

  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.level){level=target.dataset.level;view='worlds';render();return;}
    if(target.dataset.world){start(target.dataset.world);return;}
    if(target.hasAttribute('data-choice')){choose(target.dataset.value);return;}
    if(target.hasAttribute('data-match-left')){matchLeft(target.dataset.value);return;}
    if(target.hasAttribute('data-match-right')){matchRight(target.dataset.value);return;}
    if(target.hasAttribute('data-sort-item')){sortItem(target.dataset.value);return;}
    if(target.hasAttribute('data-sort-zone')){sortZone(target.dataset.value);return;}
    if(target.hasAttribute('data-order-item')){draft.items.push(target.dataset.value);render(focusFirst('[data-order-item], [data-remove-order]'));return;}
    if(target.dataset.removePair!==undefined){draft.pairs.splice(Number(target.dataset.removePair),1);render(focusFirst('[data-match-left]'));return;}
    if(target.dataset.removeSort!==undefined){const [zone,index]=target.dataset.removeSort.split(':'),item=draft.zones[zone][Number(index)];draft.zones[zone].splice(Number(index),1);render(focusValue('[data-sort-item]',item));return;}
    if(target.dataset.removeOrder!==undefined){const [item]=draft.items.splice(Number(target.dataset.removeOrder),1);render(focusValue('[data-order-item]',item));return;}
    const action=target.dataset.action;
    if(action==='home'){view='home';render();}
    if(action==='worlds'){level=session?.level||level;view='worlds';render();}
    if(action==='resume'){level=session.level;draft=session.responses[session.index]||null;view='play';render();}
    if(action==='check'){const result=E.submit(session,draft);save();if(result==='incorrect')announce('Pogledaj još jednom.');if(result==='correct')announce('Točno!');render();}
    if(action==='retry'){session.phase='answer';session.responses[session.index]=null;draft=null;pending=null;save();render();}
    if(action==='next'){E.advance(session);draft=null;pending=null;save();render();}
    if(action==='new-round')start(session.world);
  });

  render();
})();
</script>
