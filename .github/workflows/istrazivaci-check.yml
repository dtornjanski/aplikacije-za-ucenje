name: Istraživači – provjera kandidata i javnog izdanja
on:
  push:
    branches: [qa/istrazivaci-browser-check-20261118]
  workflow_dispatch:
    inputs:
      mode:
        description: Mjesto provjere
        type: choice
        options: [candidate, public]
        required: true
      commit:
        description: Puni SHA ispitivanog commita
        required: true
      sha256:
        description: SHA-256 izgrađene HTML datoteke
        required: true

permissions:
  contents: read

jobs:
  provjera:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [iskustvo, orca]
    name: Chrome / ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Odaberi izdanje
        id: target
        env:
          QA_INPUT_MODE: ${{ inputs.mode }}
          QA_INPUT_COMMIT: ${{ inputs.commit }}
          QA_INPUT_SHA256: ${{ inputs.sha256 }}
        run: python3 qa/istrazivaci/target.py configure
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.commit }}
          path: candidate
          persist-credentials: false
      - name: Pokreni lokalni poslužitelj kandidata
        if: steps.target.outputs.mode == 'candidate'
        run: python3 -u -m http.server 4173 --bind 127.0.0.1 --directory candidate/javne-aplikacije >"$RUNNER_TEMP/posluzitelj.log" 2>&1 &
      - name: Potvrdi identičnost datoteka, portal i četiri aplikacije
        run: python3 -u qa/istrazivaci/target.py verify
      - name: Pripremi preglednik i čitač zaslona
        if: matrix.suite == 'orca'
        run: |
          google-chrome --version
          sudo apt-get update -qq
          packages=(orca speech-dispatcher-espeak-ng pulseaudio at-spi2-core dbus-x11 xvfb xauth python3-selenium openbox)
          sudo apt-get --print-uris -y --no-install-recommends install "${packages[@]}" > "$RUNNER_TEMP/debs.txt"
          python3 - <<'PY'
          import concurrent.futures, os, pathlib, shlex, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def get(line):
              uri,name,*rest=shlex.split(line)
              if '/pool/' not in uri: return
              suffix='/pool/'+uri.split('/pool/',1)[1]
              for source in ['https://archive.ubuntu.com/ubuntu','https://azure.archive.ubuntu.com/ubuntu','https://security.ubuntu.com/ubuntu']:
                  if subprocess.run(['curl','-fsSL','--connect-timeout','8','--max-time','55',source+suffix,'-o',str(root/name)],capture_output=True).returncode==0:
                      subprocess.run(['sudo','cp',str(root/name),'/var/cache/apt/archives/'+name],check=True)
                      return
          lines=[l for l in (root/'debs.txt').read_text().splitlines() if l.startswith("'")]
          with concurrent.futures.ThreadPoolExecutor(20) as pool: list(pool.map(get,lines))
          PY
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          orca --version
      - name: Tipkovnica, dodir, zatvaranje Chromea i govor Orce
        if: matrix.suite == 'orca'
        run: dbus-run-session -- xvfb-run -a bash qa/istrazivaci/run.sh
      - name: Povijest ekrana, skice i mobilni prikazi
        if: matrix.suite == 'iskustvo'
        run: |
          python3 -m venv "$RUNNER_TEMP/uxenv"
          "$RUNNER_TEMP/uxenv/bin/pip" --disable-pip-version-check -q install selenium==4.38.0
          "$RUNNER_TEMP/uxenv/bin/python" -u qa/istrazivaci/iskustvo.py
      - name: Spremi snimke zaslona i stvarna mjerenja
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.mode }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ishod
          retention-days: 21
