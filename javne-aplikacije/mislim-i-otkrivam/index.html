/* Explicit product colors keep the same contrast inside an embedded preview. */
:root {
  --mio-ink:#142039;
  --mio-muted:#334155;
  --mio-purple:#4b3299;
  --mio-purple-dark:#35206f;
  --mio-line:#b5a7d2;
}
body {font-size:19px;font-weight:500;color:var(--mio-ink)}
.brand,.level-card h3,.topic strong,.question-head h1,.prompt,.story,
.option>span,.selection strong,.feedback-hero h1,.feedback-hero p,
.results-hero h1,.stat strong,.stat span,.encouragement,dialog h2 {
  color:var(--mio-ink);
  opacity:1;
  -webkit-text-fill-color:currentColor;
}
.hero p:not(.eyebrow),.level-card p,.section-heading p:not(.eyebrow),
.under-levels,.progress-text,.selection small,.topic small,
.results-hero p:not(.eyebrow),.completed-topics span,footer,dialog p,
.feedback-note,.level-number {
  color:var(--mio-muted);
  font-weight:600;
  opacity:1;
  -webkit-text-fill-color:currentColor;
}
.hero h1,.section-heading h1 {color:var(--mio-ink);-webkit-text-fill-color:currentColor}
.button {color:#fff;background:var(--mio-purple);opacity:1;-webkit-text-fill-color:currentColor}
.button:hover:not(:disabled) {background:var(--mio-purple-dark);color:#fff}
.button:disabled {background:#e6e1ef;color:#334155;border-color:#a99cbd;opacity:1}
.button.secondary {background:#fff;color:var(--mio-purple-dark);border-color:#8973b6}
.button.secondary:hover {background:#eee8fa;color:var(--mio-purple-dark)}
.text-button,.eyebrow,.step,.grade {color:var(--mio-purple-dark);opacity:1;-webkit-text-fill-color:currentColor}
.level-pill.l1 {background:#e0f4e9;color:#16442f}
.level-pill.l2 {background:#fff0dd;color:#65330d}
.level-pill.l3 {background:#e9e1fa;color:var(--mio-purple-dark)}
.option>span {border-color:#a79abb}
.option:hover>span {background:#f5f1fc;border-color:#786498}
.option input:checked+span {background:#e8defb;color:#251448;border-color:var(--mio-purple)}
.option>span:before {border-color:#78698f}
.feedback-hero.correct {background:#d9f0e2}
.feedback-hero.incorrect {background:#ffecd6}
.feedback-hero.correct>.icon {color:#165b39}
.feedback-hero.incorrect>.icon {color:#763b0e}
.question-head .eyebrow,.step,.level-number {font-size:14px}
.selection small,.topic small,.feedback-note,.completed-topics span,footer {font-size:14px}
.story {font-weight:500}
.question-card strong {font-weight:800}
@media(max-width:620px) {
  body {font-size:18px}
  .story {font-size:20px;line-height:1.6}
  .option>span {font-size:18px;line-height:1.5}
  .prompt {font-size:21px}
  .hero .eyebrow,.question-head .eyebrow,.step,.under-levels,.grade,
  .progress-text,.selection small,.topic small,.feedback-note,
  .completed-topics span,footer {font-size:13px}
  .level-card p {font-size:17px}
  .selection {font-size:18px}
}

#think-page-root .brand::before{content:'🦉';font-size:38px;line-height:1}
#think-page-root .hero-art::after{content:'🦉';position:relative;font-size:150px;line-height:1;filter:drop-shadow(0 10px 18px #3a275733)}
#think-page-root .feedback-hero::after{content:'🦉';position:absolute;right:20px;bottom:10px;font-size:64px;opacity:.22}
#think-page-root .results-hero::after{content:'🦉';font-size:120px;line-height:1}

      const isReason = run.step === task.clues.length;
      return `<ol class="inv-notes">${notes}</ol>` + (isReason
        ? field(task.why, answers(run, task.reasons))
        : field('Označi sve kartice koje odgovaraju tragovima.', board(task, run, true, true)));
    }
    function questionBoard(task, run) {
      if (run.step === 0) {
        const words = task.cards.length === 4 ? 'dvije mogućnosti' : 'tri mogućnosti';
        return board(task, run, false) + field(`Koje pitanje ostavlja ${words} i za „da” i za „ne”?`, answers(run, task.questions.map(q => q[0])));

        + field('Označi sve kartice koje još dolaze u obzir.', board(task, run, true, true));
    }

      const order = E.order(run, 'runs', task.runs.length);
      const showResults = run.step > 0;
      const units = { polja: 'u poljima', s: 'u sekundama', min: 'u minutama', cm: 'u centimetrima' };
      const unit = units[task.unit];
      const cards = order.map((id, position) => {
        if (showResults && !run.prior.pick.includes(id)) return '';
        const row = task.runs[id];
        const contents = `<span class="inv-run"><strong>Pokus ${position + 1}</strong>
          ${task.columns.map((column, index) => `<span class="inv-data"><small>${esc(column)}</small><b>${esc(row[index])}</b></span>`).join('')}
          ${showResults ? `<span class="inv-measure"><small>${esc(task.resultLabel)}${unit ? ' (' + unit + ')' : ''}</small><b>${row[row.length - 1]}</b></span>` : ''}</span>`;
        return showResults ? `<div class="inv-static">${contents}</div>` : `<label class="inv-choice"><input type="checkbox" name="inv-pick" value="${id}" ${run.pick.includes(id) ? 'checked' : ''}>${contents}</label>`;

    const top = (level, back) => `<div class="topline">${action('investigation-back', icon('back') + back, 'text-button')}${levelPill(level)}</div>`;

          <p class="encouragement">Koji ti je trag najviše pomogao? Ispričaj to nekome.</p><div class="actions">
          ${action('investigate', 'Pokreni novu istragu ' + icon('arrow'), 'button', `data-investigation-level="${level}"`)}

      return `<section class="exercise view inv-exercise">${top(level, back)}<div class="progress-wrap">
        <div class="progress" role="progressbar" aria-label="Dovršeni zadaci u istrazi" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${count}">
        ${run.ids.map((_, i) => `<span class="${i < count ? 'filled' : i === run.index ? 'current' : ''}"></span>`).join('')}</div>
        <span class="progress-text">Zadatak ${run.index + 1} od 4</span></div>

        <p class="eyebrow">${names[task.kind]}</p><h1>${esc(task.title)}</h1></div></div>
        <p class="story">${esc(task.scene)}</p><p class="inv-step">Korak ${run.step + 1} od ${E.steps(task)}</p>
        ${boards[task.kind](task, run)}<div class="inv-bottom"><p class="inv-feedback" role="status" aria-live="polite" tabindex="-1"></p>
        <div class="inv-controls">${action('investigation-check', 'Provjeri', 'button')}

          task.kind === 'clue' && run.step + 1 < task.clues.length ? 'Otkrij sljedeći trag' :
          task.kind === 'trial' ? 'Pogledaj rezultate' : 'Nastavi') + ' ' + icon('arrow'), 'button')}</div></div></div></section>`;
    }

    function sync(level) {
      const run = record(level).run;
      const status = main.querySelector('.inv-feedback');

      const correct = run.feedback === 'right';
      const count = completed(run);

      progress.setAttribute('aria-valuenow', count);

})(globalThis);</script><!--mio-investigation:end--><script>(function(){

  function validOrder(order, count) {

  function home(){return `<section class="view"><div class="hero"><div><p class="eyebrow">Mali istraživači · Velike ideje</p><h1>Svaki odgovor<br>ima svoj <span>zašto.</span></h1><p>Pogledaj, razmisli i objasni.</p></div><div class="hero-art" aria-hidden="true"><span class="spark one">✦</span><span class="spark two">✧</span><img src="${owl}" alt="" width="253" height="253"></div></div>

  function areas(){return `<section class="view"><div class="topline">${action('home',icon('back')+'Težina','text-button')}${pill()}</div><div class="section-heading"><p class="eyebrow">Slijedi svoju znatiželju</p><h1>Što ćemo istražiti?</h1><p>Odaberi malu istragu ili jedno od područja.</p></div>
    ${investigations.launch(level)}<div class="topics">${categories.map(c=>`<button class="topic" data-action="start" data-category="${c.id}"><span class="icon-well">${icon(c.icon)}</span><span><strong>${c.name}</strong><small>2 zadatka</small></span></button>`).join('')}</div><div class="mix-wrap">${action('start',icon('shuffle')+'Pomiješaj sve · 6 zadataka','button','data-category="mix"')}</div>${resume()}</section>`;}

  function render(focus=true){
    saveRound();
    if(view==='investigation'){
      main.innerHTML=investigations.screen(level,investigationReturn==='areas'?'Područja':'Početna');
      investigations.sync(level);

  }
  function navigate(next){view=next;render();}
  function start(category){
    let source=bank;

    if(act==='retry'&&E.retry(round))render();
    if(act==='next'&&E.advance(round))render();
    if(act==='again'&&round.phase==='complete')start(round.category);
  });
  document.getElementById('brand').addEventListener('click',()=>navigate('home'));
  document.getElementById('continue-round').addEventListener('click',()=>{document.getElementById('new-round-dialog').close();level=round.level;navigate('play');});
  document.getElementById('confirm-new').addEventListener('click',()=>{document.getElementById('new-round-dialog').close();start(pendingCategory);});
  window.addEventListener('storage',event=>{
    const updated=investigations.external(event.key,event.newValue);
    if(!updated)return;
    if(view==='investigation'&&updated===level&&!investigations.hasRun(level))return navigate('home');
    if((view==='investigation'&&updated===level)||(view==='areas'&&updated===level)||
       (view==='home'&&updated===investigations.selected()))render(false);
  });
  restoreRound();render(false);
})();</script></div>
</body>
</html>
