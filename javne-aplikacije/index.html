<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Aplikacije za učenje</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5fc;color:#17213b;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(860px,100%)}h1{font-size:clamp(34px,6vw,62px);line-height:1.05;margin:0 0 14px}p{font-size:20px;line-height:1.55;color:#3c4962;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{display:flex;flex-direction:column;align-items:flex-start;background:#fff;border:2px solid #d9d0ed;border-radius:24px;padding:26px;text-decoration:none;color:inherit;box-shadow:0 10px 30px #281f4d12;min-height:230px}.card:hover{border-color:#4b3299;transform:translateY(-2px)}.emoji{font-size:54px}.card strong{font-size:26px;margin:14px 0 8px}.card span:last-child{font-size:17px;color:#3c4962}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{min-height:0}}</style></head>
<body><main class="wrap"><h1>Aplikacije za učenje</h1><p>Odaberi aplikaciju i kreni vježbati.</p><div class="grid"><a class="card" href="matematicka-pustolovina/"><span class="emoji">🧮</span><strong>Matematička pustolovina</strong><span>Tri razine matematičkih zadataka za drugi razred.</span></a><a class="card" href="mislim-i-otkrivam/"><span class="emoji">🦉</span><strong>Mislim i otkrivam</strong><span>Vježbe zaključivanja, provjeravanja i objašnjavanja.</span></a></div></main></body></html>
