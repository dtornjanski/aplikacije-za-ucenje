<!doctype html>
<html lang="hr">
<head>

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#245c45">
  <title>Istraživači našeg svijeta</title>
  <style>:root{--ink:#163d31;--muted:#48665c;--forest:#245c45;--forest-dark:#174735;--leaf:#dff2d5;--sky:#dff3ff;--cream:#fffaf0;--sun:#f6c84b;--berry:#a93644;--good:#dff4df;--retry:#fff0d8;--line:#c9ded3;--shadow:0 12px 34px #173c3014;--radius:24px}
*{box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.12;letter-spacing:-.035em}
h1{font-size:clamp(34px,5vw,54px)}
h2{font-size:30px}
h3{font-size:24px}
.skip-link{position:fixed;top:-80px;left:12px;background:white;padding:12px 18px;border-radius:10px;z-index:20}
.skip-link:focus{top:12px}
button:focus-visible,a:focus-visible{outline:4px solid #823540;outline-offset:4px}
.site-header,footer{width:min(1180px,calc(100% - 48px));margin:auto}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;padding:4px;font-size:23px}

.lumi{width:180px;height:180px;position:relative;z-index:1;filter:drop-shadow(0 10px 18px #163d3124)}

.spark.one{right:28px;top:25px}.spark.two{left:20px;bottom:35px;color:var(--berry)}
.section-title{text-align:center;margin:20px 0 18px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.level-card.l1{background:var(--leaf)}.level-card.l2{background:#fff2bd}.level-card.l3{background:#f3e5e7}
.level-index{position:absolute;right:20px;top:20px;font-size:13px;font-weight:900;color:#52675e}
.level-icon{font-size:50px;line-height:1;margin-bottom:12px}
.level-card p{color:#36584b;margin:10px 0 22px;min-height:52px;font-size:16px}
.level-card .button{width:100%;margin-top:auto}
.button{min-height:52px;border:0;border-radius:14px;padding:12px 22px;background:var(--forest);color:white;font-weight:900;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.button:hover:not(:disabled){background:var(--forest-dark);transform:translateY(-2px)}
.button:disabled{background:#d6e2db;color:#63776f}
.button.secondary{background:white;color:var(--forest-dark);border:2px solid #8abda3}
.text-button{border:0;background:transparent;min-height:44px;padding:7px 0;color:var(--forest-dark);font-weight:900}
.text-button:hover{text-decoration:underline;text-underline-offset:4px}
.resume{margin-top:24px;border:2px solid #b8d9c7;background:white;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}

.topline{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:25px}
.section-heading{text-align:center;margin-bottom:28px}.section-heading p:not(.eyebrow){color:var(--muted);margin-top:11px}

.world-icon{width:52px;height:52px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:29px}

.world-card small{display:block;color:var(--muted);font-size:13px;margin-top:5px;line-height:1.35;overflow-wrap:anywhere}
.world-card b{font-size:22px;color:var(--forest)}
.exercise{max-width:920px;margin:auto}
.progress-row{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.progress{display:flex;gap:5px;flex:1;height:8px}.progress span{flex:1;background:#dce8e1;border-radius:20px}.progress span.done{background:var(--forest)}.progress span.current{background:var(--sun)}
.progress-text{font-size:13px;color:var(--muted);font-weight:900;white-space:nowrap}
.question-card{background:white;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow)}
.question-head{display:flex;align-items:center;gap:15px;margin-bottom:22px}.question-icon{width:56px;height:56px;border-radius:17px;background:var(--sky);display:grid;place-items:center;font-size:31px;flex-shrink:0}

.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.evidence-clue{background:var(--sky);border-left:5px solid var(--forest);border-radius:12px;padding:14px;font-weight:800;overflow-wrap:anywhere}.choices{display:grid;gap:11px}.choice,.tile{min-height:58px;border:2px solid #d7e5dd;background:white;border-radius:14px;padding:13px 17px;text-align:left;font-weight:800;overflow-wrap:anywhere}.choice{display:flex;align-items:center;gap:12px;width:100%}.radio{width:22px;height:22px;border:2px solid #769187;border-radius:50%;flex:0 0 auto}.choice.selected,.tile.selected{border-color:var(--forest);background:var(--leaf)}.choice.selected .radio{border-color:var(--forest);background:var(--forest);box-shadow:inset 0 0 0 4px white}
.actions{display:flex;justify-content:flex-end;gap:13px;margin-top:26px}.actions.centered{justify-content:center}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.match-grid>div{display:grid;gap:10px;align-content:start}.pair-list{display:grid;gap:8px;margin-top:17px}.pair-list button{min-height:44px;border:0;background:var(--leaf);border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:1fr 26px 1fr 20px;align-items:center;text-align:left}.pair-list i,.sequence-answer i{font-style:normal;font-size:20px}
.item-tray{display:flex;flex-wrap:wrap;gap:9px;padding:15px;border:2px dashed #b8d5c5;border-radius:16px;background:#f9fcfa;min-height:82px}.item-tray .tile{flex:1 1 170px}.empty-note{color:var(--muted);font-size:15px;align-self:center}
.zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}.zone{min-height:135px;border:2px solid #bcd9ca;background:#f7fcf9;border-radius:16px;padding:10px}.zone-target{width:100%;min-height:56px;border:0;background:transparent;text-align:left;padding:4px}.zone-target strong{display:block;text-transform:capitalize;color:var(--forest-dark)}.zone-target small{display:block;color:var(--muted);margin-top:2px}.zone-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.zone-items button{min-height:44px;border:1px solid #c8ded2;background:white;border-radius:22px;padding:7px 10px;display:flex;align-items:center;gap:7px;text-align:left}.zone-items i{font-style:normal;font-size:18px;color:var(--forest-dark)}
.sequence-answer{display:grid;gap:8px;border:2px dashed #b8d5c5;border-radius:16px;padding:14px;margin-bottom:13px;min-height:80px}.sequence-answer.time-line{border-color:#d3b64b;background:#fffdf3}.sequence-answer>p{color:var(--muted);font-size:15px}.sequence-answer button{min-height:48px;border:0;background:var(--sky);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:28px 1fr 20px;align-items:center;text-align:left;gap:9px}.sequence-answer b{width:26px;height:26px;border-radius:50%;background:var(--forest);color:white;display:grid;place-items:center}
.observation{display:grid;grid-template-columns:230px 1fr;gap:16px}.observation-scene{min-height:200px;border:3px solid var(--forest-dark);border-radius:20px;background:linear-gradient(160deg,var(--sky),var(--leaf));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.observation-scene>span{font-size:62px;line-height:1}.observation-scene>strong{font-size:19px;margin-top:10px}.observation-scene>small{color:var(--muted);margin-top:4px}.observation-options{display:grid;gap:9px}
.feedback{min-height:210px;border-radius:22px;padding:28px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}.feedback.correct{background:var(--good)}.feedback.incorrect{background:var(--retry)}.feedback>span{font-size:42px;font-weight:900}.feedback h1{font-size:36px}.feedback p:not(.eyebrow){margin-top:9px;color:#36584b}.feedback-lumi{width:125px;height:125px;margin-left:auto;flex:0 0 auto}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes float{50%{transform:translateY(-8px) rotate(1deg)}}
@media(max-width:900px){.world-grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1.45fr .8fr}.hero-lumi{width:195px;height:195px}}
@media(max-width:650px){body{font-size:17px}.site-header,footer{width:calc(100% - 32px)}main{width:calc(100% - 32px);margin-top:23px}.brand{font-size:18px}.brand>span{font-size:28px}.grade{font-size:11px;padding:5px 9px}.hero{grid-template-columns:1fr;min-height:0;gap:10px}.hero h1{font-size:38px}.hero p:not(.eyebrow){font-size:18px}.hero-art{height:150px;justify-self:end}.hero-art:before{width:150px;height:135px}.hero-lumi{width:150px;height:150px}.spark{font-size:19px}.level-grid{grid-template-columns:1fr;gap:12px}.level-card{display:grid;grid-template-columns:54px 1fr;column-gap:14px}.level-icon{grid-row:1/3;font-size:41px}.level-card p{min-height:0;margin:5px 0}.level-card .button{grid-column:1/-1;margin-top:14px}.world-grid{grid-template-columns:1fr}.world-card.mixed{grid-column:auto}.question-card{padding:21px 16px;border-radius:22px}.question-head{align-items:flex-start}.question-icon{width:43px;height:43px;font-size:24px}.question-head h1{font-size:27px}.prompt{font-size:19px}.evidence-grid,.match-grid,.zone-grid,.observation{grid-template-columns:1fr}.observation-scene{min-height:135px}.observation-scene>span{font-size:46px}.actions .button{width:100%}.feedback{padding:22px 18px;min-height:190px}.feedback h1{font-size:30px}.feedback-lumi{position:absolute;right:10px;bottom:5px;opacity:.17}.results-hero{flex-direction:column}.results-hero>div{text-align:center}.results-lumi{width:140px;height:140px}.stat strong{font-size:40px}.topline{margin-bottom:18px}.progress-row{gap:10px}.progress-text{font-size:11px}}
@media(max-width:360px){.site-header{gap:8px}.brand strong{max-width:170px;line-height:1.1}.grade{display:none}.hero h1{font-size:34px}.world-card strong{font-size:17px}.question-card{padding:18px 12px}.choice,.tile{padding:12px}.pair-list button{grid-template-columns:1fr 20px 1fr 18px;font-size:14px}.stats{gap:9px}.stat{padding:18px 7px}.stat span{font-size:13px}}

      V('Krajolik mjesta','Koji opis sadrži i prirodno i izgrađeno obilježje?','rijeka prolazi pokraj mosta',['samo tri kuće','samo šumsko drveće','samo parkirani automobili']),
      T('Od cilja do ušteđevine','Želiš uštedjeti za odabrani cilj. Poredaj korake.',['odaberi cilj štednje','saznaj koliko cilj košta','odvoji dio dobivenog novca','bilježi koliko si uštedio','kupi cilj tek kada imaš dovoljno']),
      S('Baština','Što znači čuvati baštinu?','brinuti o vrijednim prirodnim i kulturnim obilježjima',['uništiti stare predmete','sakriti sve od zajednice','mijenjati bez istraživanja']),
      M('Zanimanje i posao','Spoji zanimanje s poslom.',[['liječnik','pomaže bolesnima'],['učitelj','poučava'],['poljoprivrednik','uzgaja biljke ili životinje'],['graditelj','gradi i popravlja građevine']]),
      Z('Kulturno ili prirodno','Razvrstaj baštinu.',{kulturno:['stara gradska jezgra','narodna nošnja','tradicijska pjesma'],prirodno:['zaštićena šuma','rijetka biljka','poseban slap']}),
      C('Čuvamo vodu','Zašto ne bacamo otpad u potok ili rijeku?','štetimo vodi i živim bićima',['voda postane viša samo taj dan','most promijeni boju','ribe nauče letjeti']),
      M('Blagdani kroz godinu','Spoji blagdan ili svečanost s opisom.',[['Dani kruha','zahvaljujemo za kruh i plodove zemlje'],['Božić','kršćanski blagdan koji se slavi u prosincu'],['Nova godina','počinje nova kalendarska godina'],['Uskrs','kršćanski blagdan koji se slavi u proljeće']])
    ]
  };

  const take={easy:2,medium:3,hard:4};
  const sortTake={easy:1,medium:2,hard:3};
  const prefix={easy:'',medium:'Poveži više tragova. ',hard:'Promisli o cijeloj situaciji. '};

  function groupedSteps(steps,level){
    if(level==='hard') return steps.slice();
    if(level==='medium') return [steps[0],steps[1],`${steps[2]}, zatim ${steps[3]}`,steps[4]];
    return [`${steps[0]}, zatim ${steps[1]}`,`${steps[2]}, zatim ${steps[3]}`,steps[4]];
  }

  function hardDecision(base,def,wrong,rng){
    const names=['Lara','Bitko'],correctFirst=rng()<.5;
    const claims=correctFirst?[[names[0],def.correct],[names[1],wrong[0]]]:[[names[0],wrong[0]],[names[1],def.correct]];
    const correctName=correctFirst?names[0]:names[1],wrongName=correctFirst?names[1]:names[0];
    const answer=`${correctName} je u pravu, a ${wrongName} nije.`;
    const options=[answer,`${wrongName} je u pravu, a ${correctName} nije.`,'Oba su zapisa točna.','Nijedan zapis nije točan.'];
    return {...base,reasoning:'evidence',clues:claims.map(([name,claim])=>`${name} je zapisao/la: „${claim}”.`),prompt:`Procijeni dva zapisa kao dokaz. ${def.prompt} Tko je zaključio u skladu s činjenicama?`,options:E.shuffle(options,rng),answer};
  }

  function makeQuestion(world,level,def,index,rng){
    const meta=worlds.find(item=>item.id===world);
    const base={id:`${world}-${level}-${index}`,world,level,type:def.type,title:def.title,prompt:prefix[level]+def.prompt};
    if(['single','cause','observe'].includes(def.type)){
      const wrong=E.shuffle(def.wrong,rng);
      const question=level==='hard'?hardDecision(base,def,wrong,rng):{...base,options:E.shuffle([def.correct,...wrong.slice(0,level==='easy'?2:3)],rng),answer:def.correct};
      return def.type==='observe'?{...question,scene:[meta.icon,meta.name]}:question;
    }
    if(def.type==='match'){
      const pairs=E.shuffle(def.pairs,rng).slice(0,take[level]);
      return {...base,left:E.shuffle(pairs.map(pair=>pair[0]),rng),right:E.shuffle(pairs.map(pair=>pair[1]),rng),answer:pairs.map(pair=>pair.slice())};
    }
    if(def.type==='sort'){
      const answer={};
      for(const [name,items] of Object.entries(def.zones)) answer[name]=E.shuffle(items,rng).slice(0,sortTake[level]);
      return {...base,zones:Object.keys(answer),items:E.shuffle(Object.values(answer).flat(),rng),answer};
    }
    const answer=groupedSteps(def.steps,level);
    return {...base,prompt:`${prefix[level]}Složi cjelovit predloženi redoslijed. ${def.prompt}`,items:E.shuffle(answer,rng),answer};
  }

  const templates={};
  for(const world of worlds){
    templates[world.id]={};
    for(const level of levels) templates[world.id][level.id]=banks[world.id].map((definition,index)=>(rng)=>makeQuestion(world.id,level.id,definition,index,rng));
  }

  function templateCount(){return worlds.reduce((sum,world)=>sum+levels.reduce((total,level)=>total+templates[world.id][level.id].length,0),0);}

  function buildRound(level,world,seed){
    if(!levels.some(item=>item.id===level)) throw new Error('Nepoznata razina.');
    const rng=E.makeRng(seed);
    const half=Number(seed)&1;
    if(world==='mix') return E.shuffle(worlds.map(item=>{const list=templates[item.id][level].slice(half*6,half*6+6);return list[Math.floor(rng()*list.length)](rng);}),rng);
    if(!templates[world]) throw new Error('Nepoznati svijet.');
    return E.shuffle(templates[world][level].slice(half*6,half*6+6),rng).slice(0,5).map(factory=>factory(rng));
  }

  return {levels,worlds,banks,templates,templateCount,buildRound};
});

  <script>(function(root,factory){

  else root.WorldLessons=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(E){
  'use strict';

  const lessons=[
    ['dogovor','school','Razredni dogovor','🤝',8],['stablo','home','Obiteljsko stablo','🌳',12],
    ['lisce','autumn','Jesenski dnevnik','🍂',12],['tragovi','winter','Tragovi u snijegu','🐾',12],
    ['pupoljci','spring','Od pupa do cvijeta','🌷',12],['vrijeme','summer','Ljetna mjerenja','🌤️',12],
    ['sat','spacetime','Sat','🕒',12],['kalendar','spacetime','Kalendar','📅',24],
    ['skica','spacetime','Skica puta','🗺️',24],['uredaji','energy','Uređaji u našoj učionici','💡',12],
    ['ruke','health','Čiste ruke u školi','🧼',8],['pokus','nature','Što pluta, a što tone?','🔬',12],
    ['ustanove','place','Ustanove u mjestu','🏘️',12]
  ].map(([id,world,name,icon,cases])=>({id,world,name,icon,cases}));

  const days=['ponedjeljak','utorak','srijeda','četvrtak','petak','subota','nedjelja'];
  const months=['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
  const activities=['čitanje priče','glazbena igra','izrada plakata','rad u vrtu','sat crtanja','posjet knjižnici'];
  const girls=['Mia','Ema','Rita','Iva','Nika','Dora','Eva','Lana','Nora','Una','Tena','Klara'];
  const boys=['Tin','Borna','Luka','Fran','Jan','Roko'];
  const arrows=E.directions;
  const unique=values=>[...new Set(values)];
  const timeLabel=(hour,minute)=>String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');
  const table=(caption,headers,rows)=>({kind:'table',caption,headers,rows});
  function choice(prompt,answer,distractors,rng,visual){
    const options=E.shuffle(unique(distractors).filter(option=>option!==answer),rng).slice(0,3);
    return {type:'observe',prompt,answer,options:E.shuffle([answer,...options],rng),visual};
  }

  function clock(level,n,rng){
    const h=1+n%12,m=level==='easy'?0:level==='medium'?(n%2?0:30):[30,45,15,0][n%4];
    const visual={kind:'clock',h,m};
    if(level==='easy') return choice('Koliko je sati na uri?',timeLabel(h,0),[timeLabel(h%12+1,0),timeLabel((h+9)%12+1,0),timeLabel(h,30)],rng,visual);
    // A morning timetable keeps the 12-hour clock unambiguous.
    const hour=7+n%5,minute=level==='medium'?(n%2?30:0):m;
    visual.h=hour;visual.m=minute;
    if(level==='medium'){
      const slot=n%3,start=hour*60+minute-30*slot;
      const labels=E.shuffle(activities,rng).slice(0,3);
      const rows=labels.map((label,i)=>{const minutes=start+30*i;return [timeLabel(Math.floor(minutes/60),minutes%60),label];});
      visual.detail=table('Jutarnji raspored',['Vrijeme','Aktivnost'],rows);
      return choice('Pogledaj uru i raspored. Što upravo počinje?',labels[slot],labels,rng,visual);
    }
    const duration=[15,30,45,60][(n+Math.floor(n/4))%4],departure=hour*60+minute+duration;
    const answer=duration+' min';
    return choice('Ura pokazuje sadašnje vrijeme. Autobus polazi u '+timeLabel(Math.floor(departure/60),departure%60)+'. Koliko još čekaš?',answer,['15 min','30 min','45 min','60 min'],rng,visual);
  }

  function calendar(level,n,rng){
    const year=2027+Math.floor(n/12),month=n%12,day=6+(n*7)%16;
    const first=(new Date(Date.UTC(year,month,1)).getUTCDay()+6)%7;
    const count=new Date(Date.UTC(year,month+1,0)).getUTCDate(),weekday=(first+day-1)%7;
    const visual={kind:'calendar',year,month:months[month],first,count,day};
    const dateLabel=d=>d+'. '+String(month+1)+'.';
    if(level==='easy') return choice('Dan izleta označen je zvjezdicom. Kojega je datuma izlet?',dateLabel(day),[day-2,day+1,day+4].map(dateLabel),rng,visual);
    if(level==='medium') return choice('Kojeg je dana u tjednu izlet označen zvjezdicom?',days[weekday],[1,2,6].map(i=>days[(weekday+i)%7]),rng,visual);
    const delta=2+n%4,after=n%2===0;
    return choice('Radionica je '+delta+' dana '+(after?'nakon izleta':'prije izleta')+'. Kojega je datuma radionica?',dateLabel(day+(after?delta:-delta)),[day,day+(after?delta:-delta)+1,day+(after?delta:-delta)-1,day+(after?-1:1)].filter(d=>d>0&&d<=count).map(dateLabel),rng,visual);
  }

  function pathOptions(start,end,blocked){
    const queue=[[start,[]]],visited=new Set([start]);
    for(let i=0;i<queue.length;i++){
      const [at,steps]=queue[i];
      if(at===end)return steps;
      for(const [name,[dx,dy]] of Object.entries(arrows)){
        const x=at%3+dx,y=Math.floor(at/3)+dy,to=3*y+x;
        if(x<0||x>2||y<0||y>2||blocked.includes(to)||visited.has(to))continue;
        visited.add(to);queue.push([to,[...steps,name]]);
      }
    }
    return null;
  }
  function route(level,n){
    const length=level==='easy'?1:level==='medium'?2:3;
    const layouts=[];
    for(let start=0;start<9;start++)for(let end=0;end<9;end++){
      if(start===end)continue;
      const openPath=pathOptions(start,end,[]);
      if(openPath.length!==length)continue;
      if(level!=='hard'){layouts.push({start,end,blocked:[],path:openPath});continue;}
      for(let rock=0;rock<9;rock++){
        if(rock===start||rock===end)continue;
        const path=pathOptions(start,end,[rock]);
        if(path&&path.length===length)layouts.push({start,end,blocked:[rock],path});
      }
    }
    const {start,end,blocked,path}=layouts[(n*7)%layouts.length];
    return {type:'route',prompt:'Kreni od škole do parka u '+length+(length===1?' potezu.':' poteza.')+' Svaka strelica pomiče te za jedno polje.'+(blocked.length?' Zaobiđi radove.':''),
      visual:{kind:'map',start,end,blocked},answer:path,items:Object.keys(arrows)};
  }

  function family(level,n,rng){
    const [grand,a,b,kid]=[0,3,5,8].map(i=>girls[(n+i)%girls.length]),other=boys[n%boys.length];
    const visual={kind:'family',grand,adults:[a,b],children:[kid,other]};
    if(level==='easy')return choice('Tko je na stablu dijete osobe po imenu '+a+'?',kid,[b,other,grand],rng,visual);
    if(level==='medium')return choice(kid+' pita: „Kako se zove sestra moje mame?”',b,[a,grand,other],rng,visual);
    return choice(other+' kaže: „Tražim dijete s kojim dijelim baku, a imamo različite mame.” Koga traži?',kid,[grand,a,b],rng,visual);
  }
  function autumn(level,n,rng){
    const firstDay=1+n,lastDay=firstDay+7,a=9+n%5,b=a-(2+n%4);
    const visual=table('Ista grana u listopadu',['Datum','Listovi na grani'],[[firstDay+'. 10.','🍃 '+a],[lastDay+'. 10.','🍂 '+b]]);
    visual.leaves=[a,b];
    if(level==='easy')return choice('Koliko je listova na grani pri drugom opažanju?',String(b),[a,b+1,b-1].map(String),rng,visual);
    if(level==='medium')return choice('Što se vidi iz obaju zapisa?','Na grani je manje listova.',['Na grani je više listova.','Broj listova ostao je isti.'],rng,visual);
    return choice('Koliko je manje listova na grani tjedan dana poslije?',String(a-b),[a-b+1,a-b-1,a].map(String),rng,visual);
  }
  function winter(level,n,rng){
    const spots=['kod bora','kod klupe','uz ogradu','kraj kućice'],more=spots[n%4],less=spots[(n+1)%4];
    const a=4+n%3,b=a-1-(Math.floor(n/3)%3);
    const rows=E.shuffle([[more,'🐾'.repeat(a)],[less,'🐾'.repeat(b)]],rng);
    const visual=table('Otisci u snijegu · svaki znak označuje jedan otisak',['Mjesto','Otisci'],rows);
    visual.readable=rows.map(([spot,icons])=>spot+' — '+Array.from(icons).length+' otisaka').join('. ');
    if(level==='easy')return choice('Gdje vidiš više otisaka?',more,[less,'Na oba mjesta jednako.'],rng,visual);
    if(level==='medium')return choice('Koliko je otisaka više '+more+' nego '+less+'?',String(a-b),[a-b+1,a-b+2,0].map(String),rng,visual);
    if(n%2)return choice('Jedan otisak ne znači nužno jednu životinju. Što sigurno možeš usporediti?','Broj vidljivih otisaka na svakom mjestu.',['Točnu dob životinja.','Broj različitih životinja.','Vrijeme prolaska svake životinje.'],rng,visual);
    return choice('Koji zaključak podupiru tragovi u snijegu?','Na oba mjesta vide se tragovi prolaska.',['Točno znamo koliko je različitih životinja prošlo.','Znamo u koliko su sati životinje prošle.','Sve je otiske ostavila ista životinja.'],rng,visual);
  }
  function spring(level,n,rng){
    const first=1+n,opened=1+n%2,states=['🌱 zatvoren pup','🌷 otvoren cvijet','🌷 otvoren cvijet','🥀 ocvali cvijet'];
    if(opened===2)states[1]='🌱 zatvoren pup';
    const dates=states.map((_,i)=>(first+i*3)+'. 4.');
    const visual=table('Ista grančica u travnju',['Datum','Što vidim'],dates.map((d,i)=>[d,states[i]]));
    if(level==='easy')return choice('Na kojem je zapisu prvi put otvoren cvijet?',dates[opened],dates,rng,visual);
    if(level==='medium')return choice('Koliko je dana prošlo od prvog zapisa do prvog prikaza otvorenog cvijeta?',String(3*opened),['3','6','9','12'],rng,visual);
    return choice('Koji zaključak možeš donijeti iz dnevnika?', 'Cvijet se otvorio između opažanja označenih datumima '+dates[opened-1]+' i '+dates[opened],['Cvijet se otvorio točno u podne.','Cvijet je bio otvoren već pri prvom opažanju.','Svaki je pup u vrtu procvjetao istoga dana.'],rng,visual);
  }
  function summer(level,n,rng){
    const temps=[18+n%5,29+n%4,23+n%3],times=['8:00','13:00','18:00'];
    if(n%2)[temps[0],temps[2]]=[temps[2],temps[0]];
    const visual=table('Mjerenje temperature u hladu',['Ura','Temperatura'],times.map((t,i)=>[t,temps[i]+' °C']));
    if(level==='easy')return choice('Kolika je temperatura izmjerena u 13 sati?',temps[1]+' °C',temps.filter((_,i)=>i!==1).map(t=>t+' °C'),rng,visual);
    if(level==='medium')return choice('Želiš prošetati s odraslom osobom kada je najsvježije. Koji termin biraš prema mjerenjima?',times[temps.indexOf(Math.min(...temps))],times,rng,visual);
    const diff=Math.max(...temps)-Math.min(...temps);
    return choice('Za koliko je stupnjeva najtoplije mjerenje više od najhladnijeg?',diff+' °C',[diff-1,diff+1,diff+2].map(t=>t+' °C'),rng,visual);
  }
  function energy(level,n,rng){
    const devices=['stropna svjetiljka','stolna svjetiljka','računalo','projektor'],on=n%4,second=(on+1+Math.floor(n/4))%4;
    const after=level==='easy'?[]:[second];
    const visual=table('Prazna učionica nakon nastave',['Uređaj','Prvi prizor','Drugi prizor'],devices.map((d,i)=>[d,i===on||after.includes(i)?'radi':'ugašeno',after.includes(i)?'radi':'ugašeno']));
    if(level==='easy')return choice('Koji uređaj radi u prvom prizoru?',devices[on],devices,rng,visual);
    if(level==='medium')return choice('Usporedi dva prizora. Koji je uređaj u međuvremenu netko ugasio?',devices[on],devices,rng,visual);
    return choice('U drugom prizoru nastava je gotova i učionica je prazna. Koji se uređaj još može ugasiti?',devices[second],devices,rng,visual);
  }
  const hygiene=[
    ['uzimam užinu','prije jela'],['sjedam za ručak','prije jela'],['uzimam komad voća za užinu','prije jela'],['idem doručkovati','prije jela'],

  ];
  function cleanHands(level,n,rng){
    const count=level==='easy'?2:level==='medium'?3:4,zones=['prije jela','nakon aktivnosti'];
    const answer=Object.fromEntries(zones.map((zone,i)=>[zone,Array.from({length:count},(_,j)=>hygiene[i*4+(n+j+i*Math.floor(n/4))%4][0])]));
    return {type:'sort',prompt:'Kada pereš ruke? Razvrstaj kartice prema tome što prikazuju.',items:E.shuffle(Object.values(answer).flat(),rng),zones,answer};
  }
  const floating=[['pluteni čep','list','komadić stiropora','suha grančica'],['kamenčić','kovanica','čelična žličica','staklena pikula']];
  function experiment(level,n,rng){
    const a=floating[0][n%4],b=floating[1][(n+Math.floor(n/4))%4],guess=n%2===0?'na površini':'na dnu';
    const rows=E.shuffle([[a,guess,'na površini'],[b,guess,'na dnu']],rng);
    const visual=table('Pokus s posudom vode',['Predmet','Predviđam','Opažam'],rows);
    visual.water=rows.map(([name,,position])=>({name,surface:position==='na površini'}));
    if(level==='easy')return choice('Koji je predmet u ovom pokusu ostao na površini vode?',a,[b,'oba predmeta'],rng,visual);
    if(level==='medium')return choice('Za koji se predmet predviđanje poklapa s opažanjem?',guess==='na površini'?a:b,[a,b,'za oba predmeta'],rng,visual);
    return choice('Za koji je predmet rezultat pokusa bio drukčiji od predviđanja?',guess==='na površini'?b:a,[a,b,'za oba predmeta'],rng,visual);
  }
  const needs=[['posuditi knjigu','knjižnica'],['poslati paket','pošta'],['razgledati zbirku starih predmeta','muzej'],['doći na pregled kod liječnika','dom zdravlja'],['pogledati predstavu s glumcima na pozornici','kazalište'],['pogledati film na velikom platnu','kino']];
  function places(level,n,rng){
    const size={easy:2,medium:3,hard:4}[level],pairs=Array.from({length:size},(_,i)=>needs[(n%6+(n<6?i:-i)+6)%6]);
    return {type:'match',prompt:'Kamo bi išla? Spoji svaku potrebu s ustanovom koja je može ispuniti.',left:E.shuffle(pairs.map(p=>p[0]),rng),right:E.shuffle(pairs.map(p=>p[1]),rng),answer:pairs};
  }
  const classScenes=[
    ['uzeti riječ','dogovore se tko će prva govoriti pa zamijene uloge'],['koristiti isto povećalo','svaka promatra jedan list pa predaje povećalo drugoj'],['odabrati pjesmu','poslušaju oba prijedloga i dogovore redoslijed pjesama'],['nacrtati naslov','podijele crtanje i bojanje naslova'],
    ['koristiti istu knjigu','sjednu zajedno i naizmjence okreću stranice'],['voditi igru','dogovore se da svaka vodi jedan krug'],['predstaviti plakat','svaka predstavi dio koji je pripremila'],['zaliti razrednu biljku','dogovore različite dane za zalijevanje']
  ];
  function agreement(level,n,rng){
    const [wish,best]=classScenes[n],a=girls[n],b=girls[n+1];
    const visual=table('Prijedlozi učenica',['Tko','Želja'],[[a,wish],[b,wish]]);

      if(result==='incorrect'){remember();render(first('.inline-feedback'));announce('Još nije točno. Možeš promijeniti svoj odgovor.');}
    }else if('choice' in d){draft.selected=v;edit(byValue('[data-choice]',v));}
    else if('matchLeft' in d){session.pending=v;edit(first('[data-match-right]:not(:disabled)'));}
    else if('matchRight' in d&&session.pending){draft.pairs.push([session.pending,v]);session.pending=null;edit(first('[data-match-left], #check-button:not(:disabled)'));}
    else if('removePair' in d){const [pair]=draft.pairs.splice(Number(d.removePair),1);session.pending=pair[0];edit(first('[data-match-right]:not(:disabled)'));}
    else if('sortItem' in d){session.pending=session.pending===v?null:v;edit(session.pending?first('[data-sort-zone]'):byValue('[data-sort-item]',v));}
    else if('sortZone' in d&&session.pending){draft.zones[v].push(session.pending);session.pending=null;edit(first('[data-sort-item], #check-button:not(:disabled)'));}
    else if('removeSort' in d){const [item]=draft.zones[d.zone].splice(Number(d.removeSort),1);session.pending=item;edit(first('[data-sort-zone]'));}
    else if('sequenceItem' in d||'route' in d){draft.items.push(v);edit(first('button[data-route]:not(:disabled), [data-sequence-item], #check-button:not(:disabled)'));}
    else if('removeSequence' in d){const [removed]=draft.items.splice(Number(d.removeSequence),1);edit(byValue('[data-sequence-item], [data-route]',removed));}
    else if('move' in d){const i=Number(d.move),j=i+Number(d.delta);[draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]];edit(()=>app.querySelector('[data-remove-sequence="'+j+'"]'));}
  });
  load();render();
})();
</script>
</body>
</html>
