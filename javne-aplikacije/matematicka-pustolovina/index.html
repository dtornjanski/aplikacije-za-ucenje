<script>(function (scope) {
  'use strict';
  const levels = [
    { id: 'easy', name: 'Lagani zadaci', subtitle: 'Jedan korak do odgovora', example: '30 + 6 = ?', action: 'Odaberi lagane', image: 'sprout' },
    { id: 'medium', name: 'Teži zadaci', subtitle: 'Poveži i izračunaj', example: '37 + ? = 40', action: 'Odaberi teže', image: 'mountain' },
    { id: 'hard', name: 'Teški zadaci', subtitle: 'Razmisli u dva koraka', example: '28 − 3 + 5 = ?', action: 'Odaberi teške', image: 'rocket' }
  ];
  const topics = [
    { name: 'Brojevi do 100', description: 'Desetice, jedinice i nizovi', icon: 'numbers' },
    { name: 'Usporedi i poredaj', description: 'Veće, manje, jednako', icon: 'compare' },
    { name: 'Zbrajaj i oduzimaj', description: 'Računaj korak po korak', icon: 'arithmetic' },
    { name: 'Nepoznati broj', description: 'Otkrij što nedostaje', icon: 'unknown' },
    { name: 'Matematičke priče', description: 'Pročitaj, razmisli, izračunaj', icon: 'book' },
    { name: 'Redni i rimski brojevi', description: 'Redoslijed i brojevi I–XII', icon: 'roman' }
  ];
  const romans = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  const ordinal = ['', 'prvi', 'drugi', 'treći', 'četvrti', 'peti', 'šesti', 'sedmi', 'osmi', 'deveti', 'deseti', 'jedanaesti', 'dvanaesti'];
  const digitWords = ['nula', 'jedan', 'dva', 'tri', 'četiri', 'pet', 'šest', 'sedam', 'osam', 'devet', 'deset', 'jedanaest', 'dvanaest', 'trinaest', 'četrnaest', 'petnaest', 'šesnaest', 'sedamnaest', 'osamnaest', 'devetnaest'];
  const tensWords = ['', 'deset', 'dvadeset', 'trideset', 'četrdeset', 'pedeset', 'šezdeset', 'sedamdeset', 'osamdeset', 'devedeset'];
  const numberWord = n => n === 100 ? 'sto' : n < 20 ? digitWords[n] : tensWords[Math.floor(n / 10)] + (n % 10 ? ' ' + digitWords[n % 10] : '');
  const countWord = (n, one, few, many) => n % 100 >= 11 && n % 100 <= 14 ? many : n % 10 === 1 ? one : n % 10 >= 2 && n % 10 <= 4 ? few : many;
  function random(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function normalize(value) { return String(value).normalize('NFC').trim().toLocaleLowerCase('hr').replace(/\s+/g, ' '); }
  function sameNumber(a, b) { return /^\d+$/.test(String(a).trim()) && Number(a) === Number(b); }
  function check(q, values) {
    if (!Array.isArray(values) || values.length !== q.answers.length) return false;
    if (q.type === 'multi') return q.answers.every(a => values.map(String).includes(a)) && new Set(values.map(String)).size === q.answers.length;
    return q.answers.every((a, i) => q.numeric ? sameNumber(values[i], a) : normalize(values[i]) === normalize(a));
  }
  function makeQuestion(level, topic, variant, r, shuffle) {
    const difficulty = levels.findIndex(l => l.id === level);
    const q = { level, topic, variant, type: 'input', numeric: true, title: '', body: '', answers: [], labels: [], math: [] };
    const set = (title, body, answers, extra) => Object.assign(q, { title, body, answers: answers.map(String) }, extra || {});
    const choice = (title, body, answer, options, extra) => set(title, body, [answer], { type: 'choice', numeric: false, options: options.map(String), ...extra });
    const order = (title, nums, descending = false, roman = false) => {
      const sorted = nums.slice().sort((a, b) => descending ? b - a : a - b);
      const strings = sorted.map(n => roman ? romans[n] : String(n));

  }
  function topics() {
    main.innerHTML = `${top('Težina', 'home')}<h1 class="page-title">Što danas vježbamo?</h1><section class="topics" aria-label="Odaberi područje">${E.topics.map((t, i) => `<button class="topic-button" data-action="topic" data-topic="${i}"><span class="topic-icon">${icons[i]}</span><strong>${t.name}</strong><small>${t.description}</small></button>`).join('')}</section><div class="mix-action"><button class="primary" data-action="topic" data-topic="-1">Pomiješaj sve · 12 zadataka</button></div>`;
  }
  function input(q, i) {
    const saved = session.given[session.index];
    const value = saved && saved[i] !== undefined ? saved[i] : '';
    const name = q.labels[i] || (q.answers.length > 1 ? `Odgovor ${i + 1}` : 'Tvoj odgovor');
    const typeClass = q.textInput ? ' text' : q.romanInput ? ' roman' : q.ordinalInput ? ' ordinal' : '';
    const mode = q.numeric ? 'numeric' : 'text';
    return `<input id="answer-${i}" class="answer-input${typeClass}" type="text" inputmode="${mode}" maxlength="${q.textInput ? 60 : 12}" autocomplete="off" autocapitalize="${q.romanInput ? 'characters' : 'off'}" spellcheck="false" aria-label="${esc(name)}" aria-describedby="feedback" data-answer="${i}" value="${esc(value)}">`;
  }
  function equation(q) {
    return q.body.split('|').map(line => `<div class="equation-line">${line.split(/(\{\d+\})/g).map(part => /^\{\d+\}$/.test(part) ? input(q, Number(part.slice(1, -1))) : `<span>${esc(part)}</span>`).join('')}</div>`).join('');
  }
  function body(q) {
    if (q.format === 'comparison') {
      const parts = q.body.split('{sign}');
      return `<div class="comparison"><span class="comparison-part">${esc(parts[0])}</span><span class="sign-slot" id="sign-slot" aria-hidden="true"></span><span class="comparison-part">${esc(parts[1])}</span></div>`;
    }
    if (q.type !== 'input') return `<p class="${q.format === 'story' ? 'story-text' : 'instruction'}">${esc(q.body)}</p>`;
    if (q.format === 'story') {
      const fields = q.answers.map((_, i) => `<label class="answer-row">${esc(q.labels[i] || q.answerLabel || 'Tvoj odgovor:')} ${input(q, i)} ${esc(q.unit || '')}</label>`).join('');
      return `<p class="story-text">${q.topic === 4 ? '<span class="story-art-emoji" aria-hidden="true">📖</span>' : ''}${esc(q.body)}</p><div class="story-answer">${fields}</div>`;
    }
    if (q.format === 'compose') return `<div class="compose-prompt">${esc(q.body)}</div><div class="answer-row"><label for="answer-0">${q.ordinalInput ? 'Zapis:' : 'To je broj:'}</label>${input(q, 0)}</div>`;
    return `<div class="exercise-body">${equation(q)}</div>${q.answers.length === 1 ? '<span class="input-caption">Tvoj odgovor</span>' : ''}`;
  }
  function controls(q) {
    if (!q.options) return '';
    return `<div class="choices" role="group" aria-label="${q.type === 'order' ? 'Brojevi za slaganje' : 'Ponuđeni odgovori'}">${q.options.map((value, i) => `<button type="button" class="choice${value.length > 5 ? ' words' : ''}" data-action="choose" data-option="${i}" aria-pressed="false">${esc(value)}</button>`).join('')}</div>${q.type === 'order' ? `<div class="order-slots" id="order-slots" aria-live="polite" aria-label="Tvoj redoslijed"></div><button type="button" class="text-button order-reset" data-action="reset-order">Kreni ispočetka</button>` : ''}`;
  }
  function quiz() {
    const q = session.questions[session.index], done = session.solved.filter(Boolean).length;
    selected = q.type === 'input' ? [] : (session.given[session.index] || []).slice();
    feedback = session.solved[session.index] ? 'correct' : '';
    main.innerHTML = `${top('Područja', 'topics', `Zadatak ${session.index + 1} od ${session.questions.length}`)}<div class="progress" role="progressbar" aria-label="Riješeni zadaci" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${done}"><div class="progress-fill" style="width:${done / 12 * 100}%"></div></div><section class="exercise-sheet" aria-labelledby="question-title"><p class="eyebrow">${E.topics[q.topic].name}</p><h1 id="question-title">${esc(q.title)}</h1>${q.instruction ? `<p class="instruction">${esc(q.instruction)}</p>` : ''}<form id="answer-form" novalidate>${body(q)}${controls(q)}<div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><div class="exercise-actions"><button class="primary" id="check-button" type="submit">Provjeri odgovor</button><button class="primary" id="next-button" type="button" data-action="next" hidden>${session.index === 11 ? 'Pogledaj rezultat →' : 'Sljedeći zadatak →'}</button></div></form>${owl('exercise-mascot')}<div class="celebration" aria-hidden="true"></div></section>`;
    updateChoices();
    if (feedback) showFeedback(feedback, false);
  }
  function summary() {
    const s = E.summarize(session);
    main.innerHTML = `${top('Područja', 'topics')}<section class="summary-hero"><div><h1>Bravo, završila si vježbu!</h1><p>Svaki pokušaj te vodi naprijed.</p></div>${owl('success-mascot')}</section><section class="stats" aria-label="Rezultat vježbe"><div class="stat"><strong>${s.solved} / ${s.total}</strong><span>Riješeno</span></div><div class="stat"><strong>${s.first}</strong><span>Iz prvog pokušaja</span></div><div class="stat"><strong>${s.retried}</strong><span>Nakon ponavljanja</span></div></section><section class="practice"><h2>${s.practiceTopics.length ? 'Još malo vježbe' : 'Odlično ti ide!'}</h2><p>${s.practiceTopics.length ? s.practiceTopics.map(i => E.topics[i].name).join(' · ') : 'Sve si zadatke riješila iz prvog pokušaja.'}</p></section><div class="summary-actions"><button class="primary" data-action="new">Nova vježba</button><button class="secondary" data-action="home">Odaberi težinu</button></div>`;
  }
  function render() {
    main.classList.remove('entering');
    if (screen === 'home') home();
    if (screen === 'topics') topics();
    if (screen === 'quiz') quiz();
    if (screen === 'summary') summary();
    main.classList.add('entering');
    main.focus({ preventScroll: true });
    try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (_) {}
  }
  function updateChoices() {
    if (screen !== 'quiz') return;
    const q = session.questions[session.index];
    main.querySelectorAll('[data-option]').forEach(button => {
      const value = q.options[Number(button.dataset.option)], picked = selected.includes(value);
      button.classList.toggle('selected', picked && q.type !== 'order');
      button.classList.toggle('used', picked && q.type === 'order');
      button.setAttribute('aria-pressed', String(picked));
      button.disabled = session.solved[session.index] || (picked && q.type === 'order');
    });
    const slots = document.getElementById('order-slots');
    if (slots) slots.innerHTML = q.options.map((_, i) => `<span class="order-slot${selected[i] !== undefined ? ' filled' : ''}" aria-label="${i + 1}. mjesto: ${selected[i] !== undefined ? esc(selected[i]) : 'prazno'}">${selected[i] !== undefined ? esc(selected[i]) : ''}</span>`).join('');
    const sign = document.getElementById('sign-slot');
    if (sign) sign.textContent = selected[0] || '';
  }
  function clearFeedback() {
    if (session.solved[session.index]) return;
    feedback = '';
    const box = document.getElementById('feedback');
    box.className = 'feedback'; box.textContent = '';
    main.querySelectorAll('.answer-input').forEach(i => { i.classList.remove('incorrect'); i.removeAttribute('aria-invalid'); });
    document.getElementById('check-button').textContent = 'Provjeri odgovor';
  }
  function celebrate() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const target = main.querySelector('.celebration');
    if (!target) return;
    const colors = ['#7150bb', '#f4b323', '#59a86b', '#e58073'];
    target.innerHTML = Array.from({ length: 22 }, (_, i) => `<span class="confetto" style="--x:${Math.round(Math.sin(i * 2.4) * 260)}px;--y:${-80 - (i % 6) * 32}px;--r:${i * 41}deg;background:${colors[i % 4]};animation-delay:${i % 4 * 30}ms"></span>`).join('');
    window.setTimeout(() => { if (target.isConnected) target.innerHTML = ''; }, 1400);
    main.querySelector('.exercise-mascot')?.classList.add('success-mascot');
  }
  function showFeedback(result, animate = true) {
    feedback = result;
    const q = session.questions[session.index], box = document.getElementById('feedback');
    const emptyText = q.type === 'order' ? 'Odaberi sve brojeve pravilnim redom.' : q.type === 'input' ? 'Najprije upiši odgovor u svako polje.' : 'Najprije odaberi odgovor.';
    const message = result === 'correct' ? 'Točno! Bravo!' : result === 'incorrect' ? 'Nije točno. Pokušaj ponovno.' : emptyText;
    box.className = `feedback show ${result}`;
    box.innerHTML = `${result !== 'empty' ? `<span class="feedback-symbol" aria-hidden="true">${result === 'correct' ? '✓' : '×'}</span>` : ''}${message}`;
    main.querySelectorAll('.answer-input').forEach(i => {
      i.classList.toggle('correct', result === 'correct'); i.classList.toggle('incorrect', result === 'incorrect');
      if (result === 'incorrect') i.setAttribute('aria-invalid', 'true'); else i.removeAttribute('aria-invalid');
      i.disabled = result === 'correct';
    });
    const checkButton = document.getElementById('check-button'), nextButton = document.getElementById('next-button');
    checkButton.hidden = result === 'correct'; nextButton.hidden = result !== 'correct';
    checkButton.textContent = result === 'incorrect' ? 'Provjeri ponovno' : 'Provjeri odgovor';
    if (result === 'correct') {
      main.querySelectorAll('[data-option], [data-action="reset-order"]').forEach(b => b.disabled = true);
      const solved = session.solved.filter(Boolean).length;
      main.querySelector('.progress').setAttribute('aria-valuenow', solved);
      main.querySelector('.progress-fill').style.width = `${solved / 12 * 100}%`;
      if (animate) { celebrate(); nextButton.focus({ preventScroll: true }); }
    }
  }
  function start(topic) {
    let seed;
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') seed = window.crypto.getRandomValues(new Uint32Array(1))[0];
    else seed = (Date.now() + ++seedCounter) % 4294967296;
    if (session && session.seed === seed) seed = (seed + 1) % 4294967296;
    session = E.createSession(level, topic, seed); screen = 'quiz'; save(); render();
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    event.preventDefault();
    const action = button.dataset.action;
    if (action === 'home') { screen = 'home'; render(); }
    if (action === 'level') { level = button.dataset.level; screen = 'topics'; render(); }
    if (action === 'topics') { screen = 'topics'; render(); }
    if (action === 'topic') start(Number(button.dataset.topic));
    if (action === 'new') start(session.topic);
    if (action === 'resume') { level = session.level; screen = session.solved.every(Boolean) ? 'summary' : 'quiz'; render(); }
    if (action === 'next' && session.solved[session.index]) {
      if (session.index === session.questions.length - 1) screen = 'summary';
      else session.index++;
      save(); render();
    }
    if (action === 'choose' && screen === 'quiz' && !session.solved[session.index]) {
      const q = session.questions[session.index], value = q.options[Number(button.dataset.option)];
      if (q.type === 'order') { if (!selected.includes(value)) selected.push(value); }
      else if (q.type === 'multi') selected = selected.includes(value) ? selected.filter(v => v !== value) : [...selected, value];
      else selected = [value];
      clearFeedback(); updateChoices();
    }
    if (action === 'reset-order' && !session.solved[session.index]) { selected = []; clearFeedback(); updateChoices(); }
  });
  document.addEventListener('input', event => { if (screen === 'quiz' && event.target.matches('[data-answer]')) clearFeedback(); });
  document.addEventListener('submit', event => {
    if (event.target.id !== 'answer-form') return;
    event.preventDefault();
    const q = session.questions[session.index];
    const values = q.type === 'input' ? [...main.querySelectorAll('[data-answer]')].map(i => i.value) : selected.slice();
    const result = E.submit(session, values);
    if (result === 'locked') return;
    save(); showFeedback(result);
  });
  load(); render();
})();
</script>
</body>
</html>
